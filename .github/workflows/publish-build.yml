name: Build and publish images (Intelligent)

on:
  push:
    branches: [develop-intelligent]
    paths-ignore:
      - 'devops/**'
      - 'get-started/**'

env:
  SECRETS_ENGINE: vault

jobs:
  cancel-previous:
    name: 'Cancel Previous Runs'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: styfle/cancel-workflow-action@0.9.0
        with:
          access_token: ${{ github.token }}

  unique_id:
    runs-on: ubuntu-latest
    needs: cancel-previous
    steps:
      - name: Generate unique id
        id: unique_id
        run: echo "::set-output name=id::$(uuidgen)"
    outputs:
      unique_id: ${{ steps.unique_id.outputs.id }}

  get_affected:
    needs: cancel-previous
    uses: ./.github/workflows/test.yml
    secrets:
      NX_BASE: HEAD~1

  build-scheduler:
    name: Build scheduler
    runs-on: ubuntu-latest
    needs: [cancel-previous, unique_id, get_affected]
    if: contains(needs.get_affected.outputs.affected, 'dsb-client-gateway-scheduler')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          cache: true
          standalone: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: npx nx build dsb-client-gateway-scheduler --prod

      - name: 'Build and push image (scheduler)'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build -f ci/Docker/Dockerfile.scheduler -t energyweb/ddhub-client-gateway-scheduler .
          docker tag energyweb/ddhub-client-gateway-scheduler ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}/ddhub-client-gateway-scheduler:intelligent-${{needs.unique_id.outputs.unique_id}}
          docker push ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}/ddhub-client-gateway-scheduler:intelligent-${{needs.unique_id.outputs.unique_id}}
          docker tag energyweb/ddhub-client-gateway-scheduler ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}/ddhub-client-gateway-scheduler:intelligent-canary
          docker push ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}/ddhub-client-gateway-scheduler:intelligent-canary

      # - name: ArgoCD login
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_login
      #   with:
      #     command: login ${{ secrets.ARGOCD_DEV_URL }}
      #     options: --insecure --password ${{ secrets.ARGOCD_DEV_PASS }} --username ${{ secrets.ARGOCD_DEV_USERNAME }}

      # - name: ArgoCD overwrite Dev scheduler image tag
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_image_tag_overwrite_dev_scheduler
      #   with:
      #     command: app set ddhub-gateway-dev
      #     options: -p ddhub-client-gateway-api.clientgateway.scheduler.image.tag=${{needs.unique_id.outputs.unique_id}}

      # - name: ArgoCD overwrite Dev-1 scheduler image tag
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_image_tag_overwrite_dev1_scheduler
      #   with:
      #     command: app set ddhub-gateway-dev-1
      #     options: -p ddhub-client-gateway-api.clientgateway.scheduler.image.tag=${{needs.unique_id.outputs.unique_id}}

      # - name: ArgoCD overwrite Dev-2 scheduler image tag
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_image_tag_overwrite_dev2_scheduler
      #   with:
      #     command: app set ddhub-gateway-dev-2
      #     options: -p ddhub-client-gateway-api.clientgateway.scheduler.image.tag=${{needs.unique_id.outputs.unique_id}}
  build-be:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [cancel-previous, unique_id, get_affected]
    if: contains(needs.get_affected.outputs.affected, 'dsb-client-gateway-api')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          cache: true
          standalone: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: npx nx build dsb-client-gateway-api --prod
      - name: Build migrations
        run: pnpm run migrations:build
      - name: Generate version file
        run: echo ${{needs.unique_id.outputs.unique_id}} > version.md

      - name: 'Build and push image (Back-end)'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build -f ci/Docker/Dockerfile.backend -t energyweb/ddhub-client-gateway-backend .
          docker tag energyweb/ddhub-client-gateway-backend ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}/ddhub-client-gateway-backend:intelligent-${{needs.unique_id.outputs.unique_id}}
          docker push ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}/ddhub-client-gateway-backend:intelligent-${{needs.unique_id.outputs.unique_id}}
          docker tag energyweb/ddhub-client-gateway-backend ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}/ddhub-client-gateway-backend:intelligent-canary
          docker push ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}/ddhub-client-gateway-backend:intelligent-canary

      # - name: ArgoCD login
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_login
      #   with:
      #     command: login ${{ secrets.ARGOCD_DEV_URL }}
      #     options: --insecure --password ${{ secrets.ARGOCD_DEV_PASS }} --username ${{ secrets.ARGOCD_DEV_USERNAME }}

      # - name: ArgoCD overwrite DEV image tag
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_image_tag_overwrite
      #   with:
      #     command: app set ddhub-gateway-dev
      #     options: -p ddhub-client-gateway-api.image.tag=${{needs.unique_id.outputs.unique_id}}

      # - name: ArgoCD overwrite DEV-1 image tag
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_image_tag_dev1_overwrite
      #   with:
      #     command: app set ddhub-gateway-dev-1
      #     options: -p ddhub-client-gateway-api.image.tag=${{needs.unique_id.outputs.unique_id}}

      # - name: ArgoCD overwrite DEV-2 image tag
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_image_tag_dev2_overwrite
      #   with:
      #     command: app set ddhub-gateway-dev-2
      #     options: -p ddhub-client-gateway-api.image.tag=${{needs.unique_id.outputs.unique_id}}
  build-fe:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [cancel-previous, unique_id, get_affected]
    if: contains(needs.get_affected.outputs.affected, 'dsb-client-gateway-frontend')
    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ddhub
          POSTGRES_USER: ddhub
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          cache: true
          standalone: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run export
        env:
          DB_NAME: postgresql://ddhub:ddhub@localhost:5432/ddhub
          NEXT_PUBLIC_CUSTOM_BRANDING_PATH: ${{ secrets.CUSTOME_LOGO }}
          NEXT_PUBLIC_CUSTOM_CGW_NAME: ${{ secrets.CUSTOME_NAME }}

      - name: 'Build and push image (Front-end)'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: |
          docker build -f ci/Docker/Dockerfile.frontend -t energyweb/ddhub-client-gateway-frontend .
          docker tag energyweb/ddhub-client-gateway-frontend ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}/ddhub-client-gateway-frontend:intelligent-${{needs.unique_id.outputs.unique_id}}
          docker push ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}/ddhub-client-gateway-frontend:intelligent-${{needs.unique_id.outputs.unique_id}}
          docker tag energyweb/ddhub-client-gateway-frontend ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}/ddhub-client-gateway-frontend:intelligent-canary
          docker push ${{ secrets.EWF_REGISTRY_LOGIN_SERVER }}/ddhub-client-gateway-frontend:intelligent-canary

      # - name: ArgoCD login
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_login
      #   with:
      #     command: login ${{ secrets.ARGOCD_DEV_URL }}
      #     options: --insecure --password ${{ secrets.ARGOCD_DEV_PASS }} --username ${{ secrets.ARGOCD_DEV_USERNAME }}

      # - name: ArgoCD overwrite DEV image tag
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_image_tag_overwrite_dev_ui
      #   with:
      #     command: app set ddhub-gateway-dev
      #     options: -p ddhub-client-gateway-api.clientgateway.ui.image.tag=${{needs.unique_id.outputs.unique_id}}

      # - name: ArgoCD overwrite DEV-1 image tag
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_image_tag_overwrite_dev1_ui
      #   with:
      #     command: app set ddhub-gateway-dev-1
      #     options: -p ddhub-client-gateway-api.clientgateway.ui.image.tag=${{needs.unique_id.outputs.unique_id}}

      # - name: ArgoCD overwrite DEV-2 image tag
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_image_tag_overwrite_dev2_ui
      #   with:
      #     command: app set ddhub-gateway-dev-2
      #     options: -p ddhub-client-gateway-api.clientgateway.ui.image.tag=${{needs.unique_id.outputs.unique_id}}
