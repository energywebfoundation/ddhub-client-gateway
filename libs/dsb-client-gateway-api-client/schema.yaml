          - "messaging"
        mtls: true
    delete:
      description: "Deletes a channel.\n\n**Notes**\n- Messages already stored for it stay listed.\n- Nothing changes on the Message Broker.\n- Cannot be undone.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "ChannelController_delete"
      parameters:
        - name: "fqcn"
          required: true
          in: "path"
          description: "FQCN (fully qualified channel name) of an existing channel. Only lowercase letters, digits and dots, 1 to 255 characters."
          schema:
            pattern: "^[a-z0-9.]{1,255}$"
            example: "ewds.market.operator.pub"
            type: "string"
      responses:
        204:
          description: "Channel deleted. No response body."
        400:
          description: "`err.code`:\n- `VALIDATION::FAILED`: request validation failed, details in `err.additionalDetails.errors`. (FQCN format)\n- `CHANNEL::NOT_FOUND`: no channel with this FQCN exists in this gateway (note: returned as 400, not 404)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Delete a channel"
      tags:
        - "Channels"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: true
    put:
      description: "Updates the encryption setting and the conditions of a channel.\n\n**Send**\n- `type`: must equal the current type.\n- `payloadEncryption`: the new value.\n- `conditions` (`dids`, `roles`, `topics`, `responseTopics`): full lists that replace the current ones.\n\n**Returns**\n- The updated channel.\n\n**Notes**\n- `useAnonymousExtChannel`: omit it or send the current value.\n- `messageForms` is ignored.\n- Send `conditions`, `topics` and `responseTopics` even when empty (`[]`).\n- On an error, check whether the change was saved before retrying.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "ChannelController_update"
      parameters:
        - name: "fqcn"
          required: true
          in: "path"
          description: "FQCN (fully qualified channel name) of an existing channel. Only lowercase letters, digits and dots, 1 to 255 characters."
          schema:
            pattern: "^[a-z0-9.]{1,255}$"
            example: "ewds.market.operator.pub"
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelDto"
      responses:
        200:
          description: "The updated channel."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetChannelResponseDto"
        400:
          description: "The channel could not be updated. `err.code`:\n- `VALIDATION::FAILED`: request validation failed, details in `err.additionalDetails.errors`.\n- `CHANNEL::NOT_FOUND`: no channel with this FQCN exists in this gateway (note: returned as 400, not 404).\n- `CHANNEL::RESTRICTED_FIELDS_UPDATE`: `type` differs from the current type, or `useAnonymousExtChannel` is sent with a different value.\n- `TOPIC::NOT_FOUND`: a topic name/owner pair was not found (or not uniquely) on the message broker, or this gateway does not know a `responseTopicId`.\n- `CHANNEL::CHANNEL_TOPIC_SCHEMA_TYPE_INVALID`: a topic schema type does not fit the channel type.\n- `MB::ERROR` / `MB::UNKNOWN`: the message broker rejected or could not answer a topic or role lookup; the upstream reason is in `err.additionalDetails`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Update a channel"
      tags:
        - "Channels"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: true
