        400:
          description: "- `IAM::NOT_INITIALIZED`: no gateway identity configured yet (`POST /api/v2/identity`).\n- `BIP39::MNEMONIC_DOES_NOT_EXISTS`: the mnemonic is missing (it is created at start-up; restart the API if it was removed)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Generate the current and next association keys"
