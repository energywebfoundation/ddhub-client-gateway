  /api/v2/messages/sent/download/{cgwId}:
    get:
      description: "Downloads the original copy of a file this gateway uploaded.\n\n**Send**\n- `cgwId`: the `clientGatewayMessageId` of the upload (UUID v4).\n\n**Returns**\n- The raw file content, without a file name or content type.\n\n**Notes**\n- A copy exists only for uploads on channels with message forms enabled.\n- The copy is kept as long as the Message Broker keeps messages.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "MessageController_downloadOfflineFile"
      parameters:
        - name: "cgwId"
          required: true
          in: "path"
          description: "`clientGatewayMessageId` of the upload (UUID v4). Another value returns `500 DHCG::UNKNOWN`."
          schema:
            format: "uuid"
            example: "f923afb7-e334-419c-a72c-a60b293184ea"
            type: "string"
      responses:
        200:
          description: "Raw content of the original file."
          content:
            application/octet-stream:
              schema:
                type: "string"
                format: "binary"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        404:
          description: "`DHCG::ROUTE_NOT_FOUND`: no stored file for this ID. The ID is unknown, belongs to a message instead of a file, the channel did not have message forms enabled, or the file has expired."
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Download the original copy of a file this gateway sent"
      tags:
        - "Messaging"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: true
  /api/v2/messages/sent:
    get:
      description: "Lists the messages and files this gateway has sent and stored.\n\n**Send** (all optional)\n- `fqcn`: only this channel.\n- `topicName`, `topicOwner`: exact match.\n- `clientGatewayMessageId`: only this message; other filters and paging are ignored.\n- `messageId`, `transactionId`: replies this gateway sent to a received message or transaction.\n- `initiatingMessageId`, `initiatingTransactionId`: the original message that a received reply refers to.\n- `page`, `limit`: paging (default 5 per page).\n\n**Returns**\n- A list of sent messages, newest first. Each has the original payload, delivery counters and a delivery result for each recipient.\n\n**Notes**\n- Only channels with message forms enabled store messages.\n- With a reply filter, `fqcn` is ignored.\n- An unknown `clientGatewayMessageId` currently returns `500 DHCG::UNKNOWN`.\n- Old messages are removed when `CLEANUP_MESSAGES_CRON_ENABLED=true`.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "MessageController_getSentMessages"
      parameters:
        - name: "limit"
          required: false
          in: "query"
          description: "Page size: maximum number of sent messages returned. `0` or omitted means `5`."
          schema:
            default: 5
            example: 10
            type: "number"
        - name: "fqcn"
          required: false
          in: "query"
          description: "Only messages sent on this channel. Ignored with a reply filter."
          schema:
            example: "ddhub.apps.energyweb.channel.operating.envelope"
            type: "string"
        - name: "initiatingMessageId"
          required: false
          in: "query"
          description: "The original message that a received reply refers to: pass the reply's `initiatingMessageId`."
          schema:
            example: "657a1f0c2b3e4d5f6a7b8c9d"
            type: "string"
        - name: "initiatingTransactionId"
          required: false
          in: "query"
          description: "The original message that a received reply refers to: pass the reply's `initiatingTransactionId`."
          schema:
            example: "45d5a89f-7c2c-48b0-ae9a-54f4128e818f"
            type: "string"
        - name: "transactionId"
          required: false
          in: "query"
          description: "Replies this gateway sent to this transaction: pass the `transactionId` of a received message."
          schema:
            example: "45d5a89f-7c2c-48b0-ae9a-54f4128e818f"
            type: "string"
        - name: "messageId"
          required: false
          in: "query"
          description: "Replies this gateway sent to this message: pass the `id` of a received message."
          schema:
            example: "657a1f0c2b3e4d5f6a7b8c9d"
            type: "string"
        - name: "clientGatewayMessageId"
          required: false
          in: "query"
          description: "Only this message. Other filters and paging are ignored."
          schema:
            format: "uuid"
            example: "f923afb7-e334-419c-a72c-a60b293184ea"
            type: "string"
        - name: "topicName"
          required: false
          in: "query"
          description: "Exact match filter on the topic name."
          schema:
            example: "getOperatingEnvelope"
            type: "string"
        - name: "topicOwner"
          required: false
          in: "query"
          description: "Exact match filter on the application namespace that owns the topic."
          schema:
            example: "ddhub.apps.energyweb.iam.ewc"
            type: "string"
        - name: "page"
          required: false
          in: "query"
          description: "Page number, starting at `1`. Results are ordered by send time, newest first; page `n` skips `(n - 1) * limit` messages."
          schema:
            minimum: 1
            default: 1
            example: 1
            type: "number"
      responses:
        200:
          description: "Sent messages matching the filters (possibly empty), newest first."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/GetSentMessageResponseDto"
        400:
          description: "Request validation failed (`VALIDATION::FAILED`). `err.additionalDetails.errors` lists every failed constraint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "List messages and files this gateway sent (message forms)"
      tags:
        - "Messaging"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: true
  /api/v2/messages/received:
    get:
      description: "Lists the messages this gateway has received and stored.\n\n**Send**\n- `fqcn`: required; ignored when a reply filter is given.\n- `topicName`, `topicOwner`, `messageId`: exact match.\n- `initiatingMessageId`, `initiatingTransactionId`: the message that started a conversation.\n- `messageIds`, `transactionId`: replies to those messages or that transaction.\n- `amount`: maximum number of messages (default 3). No paging.\n\n**Returns**\n- A list of received messages, newest first. Each has `isRead`, the sender alias and reply counts.\n- `decryption.status` is always `NOT_REQUIRED`; `topicSchemaType` is always `JSD7`.\n\n**Notes**\n- Only channels with message forms enabled store messages.\n- Listing does not change which new messages you receive; the same messages can be listed again.\n- Old messages are removed when `CLEANUP_MESSAGES_CRON_ENABLED=true`.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "MessageController_getReceivedMessages"
      parameters:
        - name: "fqcn"
          required: true
          in: "query"
          description: "Name of the channel. Required.\n- Fetching new messages: the channel to read.\n- Listing stored messages: only this channel, unless a reply filter is given."
          schema:
            example: "ddhub.apps.energyweb.channel.operating.envelope"
            type: "string"
        - name: "from"
          required: false
          in: "query"
          description: "Fetching new messages only.\n- Start time (ISO 8601). Without it, reading continues where the last call stopped.\n- Keep the same value between calls, otherwise messages are returned again."
          schema:
            format: "date-time"
            example: "2024-03-31T09:48:44.357Z"
            type: "string"
        - name: "amount"
          required: false
          in: "query"
          description: "Maximum number of messages.\n- Listing stored messages: default 3."
          schema:
            example: 10
            type: "number"
        - name: "topicName"
          required: false
          in: "query"
          description: "Topic name; send it together with `topicOwner`."
          schema:
            example: "getOperatingEnvelope"
            type: "string"
        - name: "topicOwner"
          required: false
          in: "query"
          description: "Application namespace that owns the topic. Must be sent together with `topicName` (same rules as `topicName`)."
          schema:
            example: "ddhub.apps.energyweb.iam.ewc"
            type: "string"
        - name: "clientId"
          required: false
          in: "query"
          description: "Fetching new messages only.\n- Name of your integration: letters and digits, at most 247 characters.\n- Each `clientId` gets every message; callers that share one split the messages.\n- The Message Broker limits how many a gateway can have (`MESSAGING:MAXIMUM_NUMBER_OF_CLIENTS_REACHED`)."
          schema:
            maxLength: 247
            pattern: "^[a-zA-Z0-9]+$"
            example: "billingSystem1"
            type: "string"
        - name: "initiatingMessageId"
          required: false
          in: "query"
          description: "Listing stored messages only: the message that started a conversation (pass a reply's `initiatingMessageId`)."
          schema:
            example: "657a1f0c2b3e4d5f6a7b8c9d"
            type: "string"
        - name: "initiatingTransactionId"
          required: false
          in: "query"
          description: "Listing stored messages only: the message that started a conversation (pass a reply's `initiatingTransactionId`)."
          schema:
            example: "45d5a89f-7c2c-48b0-ae9a-54f4128e818f"
            type: "string"
        - name: "transactionId"
          required: false
          in: "query"
          description: "Listing stored messages only: replies to this transaction."
          schema:
            example: "45d5a89f-7c2c-48b0-ae9a-54f4128e818f"
            type: "string"
        - name: "messageId"
          required: false
          in: "query"
          description: "Listing stored messages only: the message with this ID."
          schema:
            example: "657a1f0c2b3e4d5f6a7b8c9d"
            type: "string"
        - name: "messageIds"
          required: false
          in: "query"
          description: "Listing stored messages only: replies to these message IDs (comma separated, no spaces)."
          schema:
            example: "657a1f0c2b3e4d5f6a7b8c9d,657a1f0c2b3e4d5f6a7b8c9e"
            type: "string"
      responses:
        200:
          description: "Stored received messages matching the filters (possibly empty), newest first."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/GetReceivedMessageResponseDto"
        400:
          description: "Request validation failed (`VALIDATION::FAILED`). `err.additionalDetails.errors` lists every failed constraint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "List stored received messages (message forms)"
      tags:
        - "Messaging"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: true
  /api/v2/messages/ack:
    post:
      description: "Marks received messages as read.\n\n**Send**\n- `messagesIds`: IDs of received messages (at least one).\n\n**Notes**\n- Only sets the read flag (`isRead`); it does not change which new messages you receive.\n- Marked for the logged-in user, or for the gateway when there is no user login.\n- A message counts as read once any user marked it.\n- Unknown IDs are accepted; repeating the call changes nothing.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
