        400:
          description: "Request validation failed (`VALIDATION::FAILED`). `err.additionalDetails.errors` lists every failed constraint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Mark stored received messages as read"
      tags:
        - "Messaging"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: true
  /api/v2/messages:
    get:
      description: "Fetches the next new messages of a channel, oldest first.\n\n**Send**\n- `fqcn`: the channel to read.\n- `clientId`: name of your integration (letters and digits). Keep it the same between calls.\n- `amount`: maximum number of messages.\n- `topicName` and `topicOwner`: optional, only this topic (send both).\n- `from`: optional start time (ISO 8601). Keep it the same between calls.\n\n**Returns**\n- A list of messages, oldest first, verified and decrypted where needed.\n- On file channels, each message carries the `fileId` of a file.\n\n**Notes**\n- Each `clientId` gets every message; callers that share a `clientId` split the messages.\n- Delivery is at least once: messages are confirmed on your next call, so handle duplicates (for example by `id`).\n- An empty list does not always mean nothing is left; keep polling.\n- A call made while another call with the same `clientId` and channel runs returns an empty list.\n- Check `signatureValid` and `decryption.status` before trusting `payload`.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "MessageController_getMessage"
      parameters:
        - name: "fqcn"
          required: true
          in: "query"
          description: "Name of the channel. Required.\n- Fetching new messages: the channel to read.\n- Listing stored messages: only this channel, unless a reply filter is given."
          schema:
            example: "ddhub.apps.energyweb.channel.operating.envelope"
            type: "string"
        - name: "from"
          required: false
          in: "query"
          description: "Fetching new messages only.\n- Start time (ISO 8601). Without it, reading continues where the last call stopped.\n- Keep the same value between calls, otherwise messages are returned again."
          schema:
            format: "date-time"
            example: "2024-03-31T09:48:44.357Z"
            type: "string"
        - name: "amount"
          required: false
          in: "query"
          description: "Maximum number of messages.\n- Listing stored messages: default 3."
          schema:
            example: 10
            type: "number"
        - name: "topicName"
          required: false
          in: "query"
          description: "Topic name; send it together with `topicOwner`."
          schema:
            example: "getOperatingEnvelope"
            type: "string"
        - name: "topicOwner"
          required: false
          in: "query"
          description: "Application namespace that owns the topic. Must be sent together with `topicName` (same rules as `topicName`)."
          schema:
            example: "ddhub.apps.energyweb.iam.ewc"
            type: "string"
        - name: "clientId"
          required: false
          in: "query"
          description: "Fetching new messages only.\n- Name of your integration: letters and digits, at most 247 characters.\n- Each `clientId` gets every message; callers that share one split the messages.\n- The Message Broker limits how many a gateway can have (`MESSAGING:MAXIMUM_NUMBER_OF_CLIENTS_REACHED`)."
          schema:
            maxLength: 247
            pattern: "^[a-zA-Z0-9]+$"
            example: "billingSystem1"
            type: "string"
        - name: "initiatingMessageId"
          required: false
          in: "query"
          description: "Listing stored messages only: the message that started a conversation (pass a reply's `initiatingMessageId`)."
          schema:
            example: "657a1f0c2b3e4d5f6a7b8c9d"
            type: "string"
        - name: "initiatingTransactionId"
          required: false
          in: "query"
          description: "Listing stored messages only: the message that started a conversation (pass a reply's `initiatingTransactionId`)."
          schema:
            example: "45d5a89f-7c2c-48b0-ae9a-54f4128e818f"
            type: "string"
        - name: "transactionId"
          required: false
          in: "query"
          description: "Listing stored messages only: replies to this transaction."
          schema:
            example: "45d5a89f-7c2c-48b0-ae9a-54f4128e818f"
            type: "string"
        - name: "messageId"
          required: false
          in: "query"
          description: "Listing stored messages only: the message with this ID."
          schema:
            example: "657a1f0c2b3e4d5f6a7b8c9d"
            type: "string"
        - name: "messageIds"
          required: false
          in: "query"
          description: "Listing stored messages only: replies to these message IDs (comma separated, no spaces)."
          schema:
            example: "657a1f0c2b3e4d5f6a7b8c9d,657a1f0c2b3e4d5f6a7b8c9e"
            type: "string"
      responses:
        200:
          description: "Messages, oldest first. Empty when there are no new messages, when another call for the same `clientId` and `fqcn` is in progress, or when acknowledging the previous batch failed."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/GetMessagesResponseDto"
        400:
          description: "Possible `err.code` values:\n- `VALIDATION::FAILED`: request validation failed (`fqcn` missing, invalid `clientId`).\n- `CHANNEL::NOT_FOUND`: no channel with this `fqcn`.\n- `MESSAGING::TOPIC_OWNER_AND_NAME_REQUIRED`: only one of `topicName` / `topicOwner` was given.\n- `TOPIC::NOT_RELATED_TO_CHANNEL`: the topic is not bound to the channel.\n- `BIP39::ASSOCIATION_KEY_NOT_AVAILABLE`: anonymous external channel, but the gateway has no current association key.\n- `MESSAGING:MAXIMUM_NUMBER_OF_CLIENTS_REACHED`: registering a new `clientId` would exceed the broker limit of clients per gateway.\n- `MB::ERROR` / `MB::UNKNOWN` when the message broker rejects or fails the request (`additionalDetails` carries the broker `errorCode`, `errorCodeName`, `errorCodeMessage` and `path`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Receive messages from a channel"
      tags:
        - "Messaging"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: true
    post:
      description: "Sends a message to every recipient of a `pub` channel.\n\n**Send**\n- `fqcn`: a `pub` channel with at least one recipient.\n- `topicName`, `topicOwner`, `topicVersion`: a topic of the channel.\n- `payload`: for `JSD7` topics, JSON that matches the topic schema.\n- `transactionId`: optional; reaches the recipients unchanged.\n- `initiatingMessageId`, `initiatingTransactionId`: optional, when replying.\n\n**Returns**\n- `clientGatewayMessageId` and a list of delivery results, one for each recipient.\n\n**Notes**\n- A `200` means the message was accepted, not that every recipient got it: check `recipients.failed`.\n- The message is signed, and encrypted when the channel has `payloadEncryption` enabled.\n- Every call sends a new message, even with the same content.\n- Needs a configured identity.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "MessageController_create"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageDto"
      responses:
        200:
          description: "Message accepted. The delivery result for each recipient is in `recipients` and `status`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponseDto"
        400:
          description: "Possible `err.code` values:\n- `VALIDATION::FAILED`: request validation failed (missing fields, invalid `fqcn`, invalid `anonymousRecipient`).\n- `CHANNEL::NOT_FOUND`: no channel with this `fqcn`.\n- `TOPIC::NOT_FOUND`: no topic with this name, owner and version is known to the gateway, or it has no schema.\n- `TOPIC::NOT_RELATED_TO_CHANNEL`: the topic is not bound to the channel.\n- `MESSAGING::RECIPIENTS_NOT_PRESENT`: the channel has no qualified DIDs.\n- `CHANNEL::TYPE_INVALID`: the channel is not of type `pub`.\n- `MESSAGING::PAYLOAD JSON PARSE FAILED`: `JSD7` topic and `payload` is not valid JSON.\n- `ID::NO_PRIVATE_KEY`: the gateway has no private key to sign with.\n- `MESSAGING:MAXIMUM_NUMBER_OF_CLIENTS_REACHED`: only when the body also contains a `clientId` field that would register a new client above the broker limit.\n- `MB::ERROR` / `MB::UNKNOWN` when the message broker rejects or fails the request (`additionalDetails` carries the broker `errorCode`, `errorCodeName`, `errorCodeMessage` and `path`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        422:
          description: "`DDHUB::INVALID_PAYLOAD`: the payload does not match the topic JSON Schema, or the schema itself cannot be compiled. `additionalDetails` holds the first JSON Schema validation error (`instancePath`, `schemaPath`, `keyword`, `params`, `message`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Send a message to a channel"
      tags:
        - "Messaging"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: true
  /api/v2/messages/download:
    get:
      description: "Downloads a file sent to this gateway, checked and decrypted.\n\n**Send**\n- `fileId`: from a file message received on a `download` channel.\n\n**Returns**\n- The raw file content. Treat it as binary, whatever `Content-Type` says.\n- Headers: file name (the `fileId`), `sender`, `signature`, `clientGatewayMessageId`.\n\n**Notes**\n- Available as long as the Message Broker keeps the file.\n- A signature that does not match fails with `SIG::NO_MATCH`.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "MessageController_downloadMessage"
      parameters:
        - name: "fileId"
          required: true
          in: "query"
          description: "ID of the file, from a file message on a `download` channel. Letters, digits and hyphens only."
          schema:
            pattern: "^[a-zA-Z0-9-]+$"
            example: "624bfd4f4c6cf04abfc20041"
            type: "string"
      responses:
        200:
          description: "Raw (decrypted) file content."
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"<fileId>\"`."
              schema:
                type: "string"
            sender:
              description: "DID of the sending gateway."
              schema:
                type: "string"
            signature:
              description: "Signature of the file created by the sender gateway."
              schema:
                type: "string"
            clientGatewayMessageId:
              description: "UUID of the send request on the sender gateway."
              schema:
                type: "string"
                format: "uuid"
          content:
            application/octet-stream:
              schema:
                type: "string"
                format: "binary"
        400:
          description: "Possible `err.code` values:\n- `VALIDATION::FAILED`: request validation failed (`fileId` missing or containing characters other than letters, digits and hyphens).\n- `SIG::NO_MATCH`: the file signature does not match the sender DID document (`additionalDetails`: `fileId`, `receivedSignature`).\n- `MB::ERROR` / `MB::UNKNOWN` when the message broker rejects or fails the request (`additionalDetails` carries the broker `errorCode`, `errorCodeName`, `errorCodeMessage` and `path`). For example when the broker does not know the `fileId` or the file expired."
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Download a received file"
      tags:
        - "Messaging"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: true
  /api/v2/messages/upload:
    post:
      description: "Sends a CSV file to every recipient of an `upload` channel.\n\n**Send** (form upload)\n- `file`: CSV file (`text/csv`), at most `MAX_FILE_SIZE` (default 100 MB).\n- `fqcn`: an `upload` channel with at least one recipient.\n- `topicName`, `topicOwner`, `topicVersion`: a topic of the channel.\n- `transactionId`: optional.\n\n**Returns**\n- `clientGatewayMessageId` and a list of delivery results, one for each recipient.\n\n**Notes**\n- A `200` does not mean every recipient got the file: check `recipients.failed`.\n- The file is signed, and encrypted when the channel has `payloadEncryption` enabled.\n- The content is not checked against the topic schema.\n- Needs a configured identity.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "MessageController_uploadFile"
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadMessageBodyDto"
      responses:
        201:
          description: "File accepted. The delivery result for each recipient is in `recipients` and `status`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponseDto"
        400:
          description: "Possible `err.code` values:\n- `VALIDATION::FAILED`: request validation failed (missing fields, invalid `fqcn`).\n- `MESSAGING::FILE_TYPE_NOT_MATCHED`: the `file` part is not `text/csv`.\n- `MESSAGING::FILE_SIZE_GREATER_THEN_100_MB`: the file is larger than `MAX_FILE_SIZE` (`additionalDetails.maxFileSize`).\n- `CHANNEL::NOT_FOUND`: no channel with this `fqcn`.\n- `TOPIC::NOT_FOUND`: the topic version has no schema or ID.\n- `TOPIC::NOT_RELATED_TO_CHANNEL`: the topic is not bound to the channel.\n- `CHANNEL::TYPE_INVALID`: the channel is not of type `upload`.\n- `MESSAGING::RECIPIENTS_NOT_PRESENT`: the channel has no qualified DIDs.\n- `MB::ERROR` / `MB::UNKNOWN` when the message broker rejects or fails the request (`additionalDetails` carries the broker `errorCode`, `errorCodeName`, `errorCodeMessage` and `path`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Send a CSV file to a channel"
      tags:
        - "Messaging"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: true
  /api/v2/keys/association:
