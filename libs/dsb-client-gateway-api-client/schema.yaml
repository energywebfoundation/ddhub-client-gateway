  /api/v2/login/config:
    get:
      description: "Tells whether user login is enabled.\n\n**Returns**\n- `authEnabled`: set with `USER_AUTH_ENABLED` (default `false`).\n\n**Notes**\n- `true`: protected endpoints need a login token or an API key.\n- `false`: no credentials are needed, and login is not available.\n\n**Access**\n\n- Public: no login token or API key needed."
      operationId: "LoginController_isAuthEnabled"
      parameters: []
      responses:
        200:
          description: "Current login configuration."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponseDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Get the login configuration"
      tags:
        - "Login"
      security: []
      x-access:
        public: true
        roles: []
        mtls: false
  /api/v2/login/refresh-token:
    post:
      description: "Gets new tokens without sending the password again.\n\n**Send**\n- `refreshToken`: from an earlier login or refresh.\n\n**Returns**\n- A new access token (valid 1 hour) and refresh token (valid 20 hours).\n\n**Notes**\n- Call it before the access token expires.\n- Only when `USER_AUTH_ENABLED=true`.\n\n**Access**\n\n- Public: no login token or API key needed."
      operationId: "LoginController_refreshToken"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequestDto"
      responses:
        200:
          description: "New access and refresh tokens, plus the role and username they were issued for."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseDto"
        400:
          description: "Request validation failed (`VALIDATION::FAILED`). `err.additionalDetails.errors` lists every failed constraint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Returned with `err.code` `DHCG::UNKNOWN` when the token cannot be refreshed. `err.reason` tells which case applies:\n- `Auth not enabled`: `USER_AUTH_ENABLED` is not `true`.\n- `jwt expired`, `invalid signature`, `jwt malformed` (or a similar message): the refresh token has expired, is not valid for this gateway, or is not a token.\n- `invalid token type`: an access token was sent instead of a refresh token.\n\nAlso used for unexpected internal errors."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Exchange a refresh token for a new token pair"
      tags:
        - "Login"
      security: []
      x-access:
        public: true
        roles: []
        mtls: false
  /api/v2/login:
    post:
      description: "Logs in with a username and password.\n\n**Send**\n- `username` and `password`.\n\n**Returns**\n- `accessToken` (valid 1 hour), `refreshToken` (valid 20 hours), `role` and `username`.\n\n**Notes**\n- Send the access token as `Authorization: Bearer <accessToken>`.\n- To log out, discard the tokens.\n- Only when `USER_AUTH_ENABLED=true`.\n\n**Access**\n\n- Public: no login token or API key needed."
      operationId: "LoginController_login"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDto"
      responses:
        200:
          description: "Login succeeded. Contains the token pair, the role and the username."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseDto"
        400:
          description: "Request validation failed (`VALIDATION::FAILED`). `err.additionalDetails.errors` lists every failed constraint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Returned with `err.code` `DHCG::UNKNOWN` when login is refused. `err.reason` tells which case applies:\n- `Auth not enabled`: `USER_AUTH_ENABLED` is not `true`.\n- `User does not exist or password is incorrect`: unknown username or wrong password (the two cases are deliberately not distinguished).\n\nAlso used for unexpected internal errors (for example when the user accounts cannot be read)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Log in with username and password"
      tags:
        - "Login"
      security: []
      x-access:
        public: true
        roles: []
        mtls: false
  /api/v2/login/logout:
    post:
      description: "Logs the gateway out of the EWDS Message Broker and straight back in, to get fresh credentials.\n\n**Notes**\n- Does not log out a user: tokens and API keys keep working.\n- Use it after a role change, or to end the Message Broker sessions of the gateway.\n- Other instances of the same deployment do the same within about a minute.\n- A `200` means it was attempted; the gateway status shows whether it is connected again.\n\n**Access**\n\n- Public: no login token or API key needed."
      operationId: "LoginController_logout"
      parameters: []
      responses:
        200:
          description: "Logout and re-login attempted. Empty body."
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Reset the gateway session with the Message Broker"
      tags:
        - "Login"
      security: []
      x-access:
        public: true
        roles: []
        mtls: false
  /api/v2/user-api-key/users/me:
    get:
      description: "Gets the account of the logged-in user.\n\n**Returns**\n- `username`, `password` and `role`. Treat it as sensitive.\n- Empty body with an API key, or when login is disabled.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "UserApiKeyController_getCurrentUser"
      parameters: []
      responses:
        200:
          description: "The current user account. Empty body when no account matches the caller (API key authentication, or authentication disabled)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailsDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Get the account of the logged in user"
      tags:
        - "User-ApiKey"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
  /api/v2/user-api-key/users:
    post:
      description: "Creates a user account.\n\n**Send**\n- `username`: 4 to 64 characters, not taken yet.\n- `password`: 4 to 128 characters.\n- `role`: `admin` or `messaging`.\n\n**Notes**\n- The account can log in straight away.\n- The role cannot be changed later.\n- Other gateway instances that share the accounts see it after they restart.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "UserApiKeyController_setUserPassword"
      parameters: []
      requestBody:
        required: true
        description: "The account to create."
        content:
          application/json:
            schema:
              type: "object"
              properties:
                username:
                  type: "string"
                  description: "Login name of the new account. Must not exist yet. Avoid `/` and spaces."
                  example: "operator01"
                password:
                  type: "string"
                  format: "password"
                  description: "Password of the new account (4 to 128 characters)."
                  example: "change-me-please"
                role:
                  type: "string"
                  enum:
                    - "admin"
                    - "messaging"
                  description: "Role of the new account: `admin` or `messaging`. Any other value, including `superadmin`, is rejected.\n- `admin`: all endpoints.\n- `superadmin`: same as `admin`.\n- `messaging`: messaging and read-only lookups only."
                  example: "messaging"
              required:
                - "username"
                - "password"
                - "role"
      responses:
        201:
          description: "Account created. Empty body."
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Returned with `err.code` `DHCG::UNKNOWN`. `err.reason` tells which case applies:\n- `Creating SUPERADMIN users is not allowed`: `role` was `superadmin`.\n- `Invalid role \"<role>\"`: `role` is missing or is not `admin` or `messaging`.\n- `User already exists`: an account with this `username` already exists.\n\nAlso used for storage failures and unexpected internal errors."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Create a user account"
      tags:
        - "User-ApiKey"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
    put:
      description: "Changes the password of a user account.\n\n**Send**\n- `username`, and the new `password` (4 to 128 characters).\n\n**Notes**\n- The role does not change.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "UserApiKeyController_updateUserPassword"
      parameters: []
      requestBody:
        required: true
        description: "The account and its new password."
        content:
          application/json:
            schema:
              type: "object"
              properties:
                username:
                  type: "string"
                  description: "Username of the existing account."
                  example: "operator01"
                password:
                  type: "string"
                  format: "password"
                  description: "New password (4 to 128 characters)."
                  example: "a-new-password"
              required:
                - "username"
                - "password"
      responses:
        200:
          description: "Password changed. Empty body."
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        404:
          description: "No account exists with this `username` (`err.code` `DHCG::ROUTE_NOT_FOUND`, `err.reason` `User does not exist`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Change the password of a user account"
      tags:
        - "User-ApiKey"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
    get:
      description: "Lists all user accounts.\n\n**Returns**\n- A list of accounts. Each has `username`, `password` and `role`. Treat it as sensitive.\n\n**Notes**\n- Changes made through another gateway instance appear after this instance restarts.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "UserApiKeyController_getAllUsers"
      parameters: []
      responses:
        200:
          description: "All user accounts. Empty array when there are none."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/UserDetailsDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "List all user accounts"
      tags:
        - "User-ApiKey"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
  /api/v2/user-api-key/users/{username}:
    delete:
      description: "Deletes a user account.\n\n**Notes**\n- Keep at least one other `admin` account or API key.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "UserApiKeyController_deleteUser"
      parameters:
        - name: "username"
          required: true
          in: "path"
          description: "Username of the account to delete."
          schema:
            example: "operator01"
            type: "string"
      responses:
        200:
          description: "Account deleted (or did not exist). Empty body."
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Delete a user account"
      tags:
        - "User-ApiKey"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
  /api/v2/user-api-key/api-keys:
    post:
      description: "Creates an API key.\n\n**Send**\n- `name`: a label, not used by another key.\n- `daysValid`: optional, default 30.\n- `role`: `admin`, `superadmin` or `messaging` (default `messaging`).\n\n**Returns**\n- The key in `apiKey`, with `name`, `expiresAt` and `role`.\n\n**Notes**\n- Send the key in the `x-api-key` header.\n- An expired key stops working but stays listed until deleted.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "UserApiKeyController_createApiKey"
      parameters: []
      requestBody:
        required: true
        description: "Properties of the new API key."
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  description: "Label of the key, for example the integration that uses it. Must not be used by another key."
                  example: "erp-integration"
                daysValid:
                  type: "number"
                  default: 30
                  description: "Validity in days, counted from now. Fractions are allowed (`0.5` = 12 hours). It is not range-checked: `0` or a negative value creates a key that is already expired. Defaults to `30` when omitted."
                  example: 90
                role:
                  type: "string"
                  enum:
                    - "admin"
                    - "superadmin"
                    - "messaging"
                  default: "messaging"
                  description: "Role granted to requests that use this key. Defaults to `messaging` when omitted.\n- `admin`: all endpoints.\n- `superadmin`: same as `admin`.\n- `messaging`: messaging and read-only lookups only."
                  example: "messaging"
              required:
                - "name"
      responses:
        201:
          description: "The created key, including its value in `apiKey`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponseDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Returned with `err.code` `DHCG::UNKNOWN`. `err.reason` tells which case applies:\n- `Invalid role \"<role>\"`: `role` is not one of the documented values.\n- `API key with name \"<name>\" already exists.`: another key already uses this `name`.\n\nAlso used for storage failures and unexpected internal errors."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Create an API key"
      tags:
        - "User-ApiKey"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
    get:
      description: "Lists all API keys.\n\n**Returns**\n- A list of keys, expired ones included. Each has its value, name, expiry and role.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "UserApiKeyController_getAllApiKeys"
      parameters: []
      responses:
        200:
          description: "All API keys. Empty array when there are none."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ApiKeyResponseDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "List all API keys"
      tags:
        - "User-ApiKey"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
  /api/v2/user-api-key/api-keys/{apiKey}:
    get:
      description: "Gets one API key.\n\n**Returns**\n- Name, expiry and role of the key, expired or not.\n- Empty body for an unknown key.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "UserApiKeyController_getApiKey"
      parameters:
        - name: "apiKey"
          required: true
          in: "path"
          description: "The API key (48 lowercase letters and digits). It ends up in URLs and logs."
          schema:
            example: "k3v9x0q2m7w1z8r4t6y5u0i9o8p7a6s5d4f3g2h1j0klzx9c"
            type: "string"
      responses:
        200:
          description: "The API key. Empty body when the key does not exist."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponseDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Get an API key"
      tags:
        - "User-ApiKey"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
    put:
      description: "Changes the name, validity or role of an API key. The key itself stays the same.\n\n**Send**\n- `name`: the current name to keep it, or a new name not used by another key.\n- `daysValid`: the key works this many days from now. Also renews an expired key.\n- `role`: optional; omit it to keep the current role.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "UserApiKeyController_updateApiKey"
      parameters:
        - name: "apiKey"
          required: true
          in: "path"
          description: "The API key (48 lowercase letters and digits). It ends up in URLs and logs."
          schema:
            example: "k3v9x0q2m7w1z8r4t6y5u0i9o8p7a6s5d4f3g2h1j0klzx9c"
            type: "string"
      requestBody:
        required: true
        description: "New properties of the key. The key value itself never changes."
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  description: "New label of the key (send the current one to keep it). A changed name must not be used by another key."
                  example: "erp-integration"
                daysValid:
                  type: "number"
                  description: "New validity in days, counted from the time of this call (not from the original creation). Fractions allowed; `0` or negative values expire the key immediately. There is no default on update: omitting it makes the call fail."
                  example: 30
                role:
                  type: "string"
                  enum:
                    - "admin"
                    - "superadmin"
                    - "messaging"
                  description: "New role of the key. When omitted the current role is kept (or `messaging` if the key has none).\n- `admin`: all endpoints.\n- `superadmin`: same as `admin`.\n- `messaging`: messaging and read-only lookups only."
                  example: "admin"
              required:
                - "name"
                - "daysValid"
      responses:
        200:
          description: "The updated key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponseDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Returned with `err.code` `DHCG::UNKNOWN`. `err.reason` tells which case applies:\n- `Invalid role \"<role>\"`: `role` is not one of the documented values.\n- `API key \"<apiKey>\" not found.` or another \"not found\" message: the key does not exist.\n- `API key with name \"<name>\" already exists.`: another key already uses the new `name`.\n- `Invalid time value`: `daysValid` is missing or not a number.\n\nAlso used for unexpected internal errors."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Update the name, validity and role of an API key"
      tags:
        - "User-ApiKey"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
    delete:
      description: "Deletes an API key.\n\n**Notes**\n- Always returns `200`, also for an unknown key.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "UserApiKeyController_deleteApiKey"
      parameters:
        - name: "apiKey"
          required: true
          in: "path"
          description: "The API key (48 lowercase letters and digits). It ends up in URLs and logs."
          schema:
            example: "k3v9x0q2m7w1z8r4t6y5u0i9o8p7a6s5d4f3g2h1j0klzx9c"
            type: "string"
      responses:
        200:
          description: "Deletion attempted. Empty body."
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Delete an API key"
      tags:
        - "User-ApiKey"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
  /api/v2/user-api-key/api-keys/{apiKey}/validate:
    get:
      description: "Checks whether an API key works.\n\n**Returns**\n- `true` when the key exists and has not expired, otherwise `false`.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "UserApiKeyController_validateApiKey"
      parameters:
        - name: "apiKey"
          required: true
          in: "path"
          description: "The API key (48 lowercase letters and digits). It ends up in URLs and logs."
          schema:
            example: "k3v9x0q2m7w1z8r4t6y5u0i9o8p7a6s5d4f3g2h1j0klzx9c"
            type: "string"
      responses:
        200:
          description: "`true` when the key exists and is not expired, `false` when it does not exist or is expired."
          content:
            application/json:
              schema:
                type: "boolean"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Check whether an API key is usable"
      tags:
        - "User-ApiKey"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
  /api/v2/ssi-hub/roles:
    get:
      description: "Lists the role requests of the gateway DID in SSI Hub.\n\n**Returns**\n- A list of role requests. Each has its `id`, role, `status` (pending, approved or rejected) and expiry.\n\n**Notes**\n- Use the `id` to withdraw a pending request.\n- Needs a configured identity, otherwise `500 DHCG::UNKNOWN`.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`."
      operationId: "RolesController_getMyRoles"
      parameters: []
      responses:
        200:
          description: "A list of role requests of the gateway DID. Empty if none."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/RequesterClaimDTO"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "List role claims requested by the gateway DID"
      tags:
        - "SSI Hub"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: false
  /api/v2/ssi-hub/apps:
    get:
      description: "Searches SSI Hub for applications and organisations.\n\n**Send**\n- `searchKey`: 3 to 247 characters, matched against names and namespaces.\n\n**Returns**\n- A list of matching applications and organisations. Each has its `namespace`.\n\n**Notes**\n- Needs a configured identity, otherwise `500 DHCG::UNKNOWN`.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`."
      operationId: "RolesController_getApps"
      parameters:
        - name: "searchKey"
          required: true
          in: "query"
          description: "Search phrase matched by SSI Hub against application and organisation names and namespaces. Between 3 and 247 characters."
          schema:
            minLength: 3
            maxLength: 247
            example: "ddhub"
            type: "string"
      responses:
        200:
          description: "Matching applications and organisations. Empty array if nothing matches."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/SearchAppDTO"
        400:
          description: "Request validation failed (`VALIDATION::FAILED`). `err.additionalDetails.errors` lists every failed constraint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Search SSI Hub applications and organisations"
      tags:
        - "SSI Hub"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: false
  /api/v2/ssi-hub/apps/{namespace}/roles:
    get:
      description: "Lists the roles defined under an application or organisation.\n\n**Send**\n- `namespace`: namespace of the application or organisation.\n\n**Returns**\n- A list of roles. Each has its `namespace` and the `requestorFields` to fill in when requesting it.\n\n**Notes**\n- Needs a configured identity, otherwise `500 DHCG::UNKNOWN`.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`."
      operationId: "RolesController_getAppRoles"
      parameters:
        - name: "namespace"
          required: true
          in: "path"
          description: "Namespace of the application or organisation."
          schema:
            example: "ddhub.apps.energyweb.iam.ewc"
            type: "string"
      responses:
        200:
          description: "Roles defined under the namespace. Empty array if none."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ApplicationRoleDTO"
        400:
          description: "Request validation failed (`VALIDATION::FAILED`). `err.additionalDetails.errors` lists every failed constraint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "List the roles defined by an application"
      tags:
        - "SSI Hub"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: false
  /api/v2/ssi-hub/role:
    post:
      description: "Requests a role for the gateway DID.\n\n**Send**\n- `role`: full role namespace (`<role>.roles.<application namespace>`).\n- `requestorFields`: values for the fields the role asks for. Omit when there are none.\n\n**Notes**\n- An issuer of the role must approve the request.\n- Status: `AWAITING_APPROVAL`, then `APPROVED` or `REJECTED`. Once approved, the gateway publishes the role and it becomes `SYNCED`.\n- Needs a configured identity, otherwise `500 DHCG::UNKNOWN`.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`."
      operationId: "RolesController_requestRole"
      parameters: []
      requestBody:
        required: true
        description: "Role to request and requestor field values."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestRoleDto"
      responses:
        204:
          description: "Claim request submitted to SSI Hub. Empty body."
        400:
          description: "Request validation failed (`VALIDATION::FAILED`). `err.additionalDetails.errors` lists every failed constraint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Request a role for the gateway DID"
      tags:
        - "SSI Hub"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: false
  /api/v2/ssi-hub/role/{id}:
    delete:
      description: "Withdraws a pending role request.\n\n**Send**\n- `id`: id of the role request.\n\n**Notes**\n- Only pending requests (`AWAITING_APPROVAL`) can be withdrawn; other attempts fail with `500 DHCG::UNKNOWN`.\n- Does not take away a role that was already issued.\n- Needs a configured identity.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`."
      operationId: "RolesController_deleteRole"
      parameters:
        - name: "id"
          required: true
          in: "path"
          description: "Id of the role request."
          schema:
            example: "7281a130-e2b1-430d-8c14-201010eae901"
            type: "string"
      responses:
        204:
          description: "Claim request deleted. Empty body."
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Withdraw a pending role request"
      tags:
        - "SSI Hub"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: false
info:
  title: "EWDS Client Gateway API"
  description: "REST API of the **EWDS Client Gateway (EWDS CGW)**, the participant-hosted gateway that connects an organisation to the Energy Web Digital Spine (EWDS) so it can exchange credential-governed data with every authorised counterparty.\n\nAll routes are served under `/api/v2`. The OpenAPI document is available at `/docs-json` (or `/docs-yaml`) and can be imported into Postman.\n\n<details>\n<summary><strong>Getting started</strong></summary>\n\n1. **Identity**: set the gateway private key with `POST /identity`. The gateway derives its DID and publishes its signing and RSA public keys to the DID document.\n2. **Enrolment**: request the roles needed under `PARENT_NAMESPACE` with `POST /enrol`, then wait until an issuer approves them. Track progress with `GET /enrol`; the gateway is ready once every required role is `SYNCED`.\n3. **mTLS** (when `MTLS_ENABLED=true`): upload the client certificate for the message broker with `POST /certificate`.\n4. **Topics**: find the payload schemas you want to use with `GET /applications` and `GET /topics`, or create your own with `POST /topics` (the message broker checks that the gateway DID may manage topics of the owning application).\n5. **Channels**: create a channel per data flow with `POST /channels`. The channel type decides the direction and the endpoints used:\n\n| Channel type | Direction | Endpoints |\n|---|---|---|\n| `pub` | Send messages | `POST /messages` |\n| `sub` | Receive messages | `GET /messages`, `POST /messages/ack`, WebSocket `/events` |\n| `upload` | Send files | `POST /messages/upload` |\n| `download` | Receive files | `GET /messages/download` |\n\n6. **Exchange data**: send and receive messages and files through the channel. Every message is signed by the gateway; payloads are additionally encrypted end-to-end when the channel has `payloadEncryption` enabled.\n\n</details>\n\n<details>\n<summary><strong>Authentication and roles</strong></summary>\n\nAuthentication is controlled by the `USER_AUTH_ENABLED` environment variable.\n\n* `USER_AUTH_ENABLED=false` (default): no credentials are required on any endpoint.\n* `USER_AUTH_ENABLED=true`: every endpoint marked with a lock requires **one** of:\n  * `Authorization: Bearer <accessToken>`: an access token obtained from `POST /login` (valid for 1 hour, renew it with `POST /login/refresh-token`).\n  * `x-api-key: <apiKey>`: an API key created with `POST /user-api-key/api-keys`. Recommended for system-to-system integrations.\n\nEach user and API key carries exactly one role:\n\n| Role | Access |\n|---|---|\n| `superadmin` | Every endpoint. |\n| `admin` | Every endpoint. |\n| `messaging` | Only the endpoints that list `messaging` in their **Access** section: mainly sending and receiving messages, and reading channels, topics, applications and clients. Configuration endpoints are rejected. API keys stored without a role are treated as `messaging`. |\n\nRequests whose user or API key has any other role are rejected.\n\nEach operation below has an **Access** section (and an `x-access` extension) that is generated from the guards actually applied in code, so it always reflects runtime behaviour. Credential and role failures return **HTTP 403** with error code `DHCG::UNAUTHORIZED`.\n\n</details>\n\n<details>\n<summary><strong>Errors</strong></summary>\n\nEvery error response has the same shape (`ResponseErrorDto`):\n\n```json\n{\n  \"err\": {\n    \"code\": \"VALIDATION::FAILED\",\n    \"reason\": \"Validation failed\",\n    \"additionalDetails\": { \"errors\": [\"fqcn must be a string\"] }\n  },\n  \"statusCode\": 400,\n  \"timestamp\": \"2026-01-01T00:00:00.000Z\"\n}\n```\n\n`err.code` is a stable, namespaced identifier (see the `ResponseError.code` schema for the full list). Use it, not `err.reason`, for programmatic handling.\n\n| Prefix | Origin |\n|---|---|\n| `DHCG::` | Gateway generic errors (unknown error, unauthorized, route not found) |\n| `VALIDATION::` | Request body, query or path parameter validation |\n| `ID::`, `IAM::` | Gateway identity and the Energy Web SSI-Hub client |\n| `BIP39::` | Association key mnemonic |\n| `CHANNEL::`, `TOPIC::` | Channel and topic configuration |\n| `MESSAGING::` | Sending, receiving and file transfer |\n| `DDHUB::`, `MB::` | Errors returned by the EWDS Message Broker |\n| `SIG::` | Message signature verification |\n| `SECRETS_ENGINE::` | Secret storage configuration (operator side) |\n| `CONTACT::` | Address book |\n\n</details>\n\n<details>\n<summary><strong>WebSocket</strong></summary>\n\nWhen `WEBSOCKET=SERVER`, subscribers can receive messages pushed in real time at `ws(s)://<host>/events?clientId=<clientId>` with sub-protocol `ddhub-protocol`, instead of polling `GET /messages`. `EVENTS_EMIT_MODE` (`SINGLE` or `BULK`) and `EVENTS_MAX_PER_SECOND` control how messages are emitted. The WebSocket is not described by this OpenAPI document.\n\n</details>"
  version: "2.0"
  contact: {}
tags:
  - name: "Health"
    description: "Liveness and readiness of the gateway and of the services it depends on. Public; intended for container orchestrators and load balancers."
  - name: "Gateway"
    description: "Current gateway status: version, DID, message broker connection, certificate and login mode. Public."
  - name: "Login"
    description: "Exchange a username and password for a JWT access/refresh token pair, refresh tokens, and discover whether user authentication is enabled. Only meaningful when `USER_AUTH_ENABLED=true`."
  - name: "User-ApiKey"
    description: "Manage user accounts and API keys. Every user and API key carries one role (`admin`, `superadmin` or `messaging`) that decides which endpoints it can call."
  - name: "Identity"
    description: "The gateway DID: set its private key, read its public keys, balance and enrolment status, and list its claims (role credentials)."
  - name: "Enrolment"
    description: "Role enrolment of the gateway DID. The gateway needs the `user.roles.<PARENT_NAMESPACE>` role to be approved and synced to its DID document before it can log in to the EWDS Message Broker."
  - name: "SSI Hub"
    description: "Proxy to the Energy Web SSI-Hub: list applications and their roles, read the roles held by the gateway DID, and request or remove role claims."
  - name: "Gateway Configuration"
    description: "Gateway-level configuration such as the mTLS client certificate used to reach the EWDS Message Broker."
  - name: "Keys configuration"
    description: "Association keys: short-lived keys that other participants can use to send messages to this gateway instead of its DID."
  - name: "Applications"
    description: "Applications registered in the Energy Web SSI-Hub that the gateway DID is related to. Applications own topics."
  - name: "Topics"
    description: "Topics are versioned payload schemas owned by an application namespace. Every message is sent on one topic version and validated against its schema."
  - name: "Channels"
    description: "Channels are local gateway configurations, identified by an FQCN, that bind topics to a direction (publish/subscribe, messaging/file transfer) and to the DIDs or roles allowed to send to or receive from them."
  - name: "Messaging"
    description: "Send, receive, acknowledge and download messages and files through a channel. Payloads are signed and encrypted end-to-end by the gateway."
  - name: "Address Book"
    description: "Local address book that maps counterpart DIDs to human-readable aliases. Only used for display."
  - name: "Clients"
    description: "Message broker consumer clients (durable subscriptions) created by this gateway. Each `clientId` keeps its own read position on every subscribed channel."
  - name: "Cron"
    description: "Status of the background jobs (cron) run by the API and the scheduler."
servers: []
components:
  securitySchemes:
    bearer:
      scheme: "bearer"
      bearerFormat: "JWT"
      type: "http"
      description: "Access token returned by `POST /api/v2/login` (field `accessToken`). Valid for 1 hour. Only checked when `USER_AUTH_ENABLED=true`."
    api-key:
      type: "apiKey"
      in: "header"
      name: "x-api-key"
      description: "API key created with `POST /api/v2/user-api-key/api-keys`. The key role (`admin`, `superadmin` or `messaging`) decides which endpoints it can call. Only checked when `USER_AUTH_ENABLED=true`."
  schemas:
    RoleDto:
      type: "object"
      properties:
        namespace:
          type: "string"
          description: "Full role namespace: `<role>.roles.<application namespace>`."
          example: "user.roles.ddhub.apps.energyweb.iam.ewc"
        required:
          type: "boolean"
          description: "Whether the gateway needs this role to work. Only `user.roles.<PARENT_NAMESPACE>` is required; other roles are listed for information."
          example: true
        status:
          type: "string"
          enum:
            - "NOT_ENROLLED"
            - "AWAITING_APPROVAL"
            - "APPROVED"
            - "REJECTED"
            - "SYNCED"
          description: "Status of the role:\n- `NOT_ENROLLED`: not requested yet (only shown for required roles).\n- `AWAITING_APPROVAL`: requested, waiting for an issuer.\n- `APPROVED`: approved; the gateway publishes it within about a minute.\n- `REJECTED`: rejected by the issuer; not requested again automatically.\n- `SYNCED`: published and active. Required roles must be `SYNCED`."
          example: "SYNCED"
      required:
        - "namespace"
        - "required"
        - "status"
    EnrolmentDto:
      type: "object"
      properties:
        did:
          type: "string"
          description: "DID of the gateway identity this enrolment belongs to."
          example: "did:ethr:volta:0xfeFBb03EFc1054Cc4e3Fbf36362689cc1F5924a8"
        roles:
          description: "Roles of the gateway with their status.\n- Every requested role, plus `NOT_ENROLLED` entries for required roles not requested yet.\n- Updated about once a minute."
          type: "array"
          items:
            $ref: "#/components/schemas/RoleDto"
      required:
        - "did"
        - "roles"
    IdentityResponseDto:
      type: "object"
      properties:
        address:
          type: "string"
          description: "Blockchain address of the gateway identity. The gateway DID is `did:ethr:<chain>:<address>`."
          example: "0xfeFBb03EFc1054Cc4e3Fbf36362689cc1F5924a8"
        balance:
          type: "string"
          enum:
            - "LOW"
            - "OK"
            - "NONE"
          description: "Funds on `address`, used for small transaction fees:\n- `NONE`: no funds; setting up the identity and requesting roles fail.\n- `LOW`: below 0.005; works, but top up soon.\n- `OK`: 0.005 or more."
          example: "OK"
        enrolment:
          description: "Roles of the gateway and their status."
          allOf:
            - $ref: "#/components/schemas/EnrolmentDto"
        publicKey:
          type: "string"
          description: "Public key of the gateway identity. It is published in the DID document so that other parties can check the signatures of messages from this gateway."
          example: "0x04341da2f081cef1a9c19557551b9c9f10ce135eeec9e45a41f3750db8ef2d34e990b27ee730c6643d1862f5899dccbdf011e8a33fd8cd7de42442b0c7570540db"
      required:
        - "address"
        - "balance"
        - "enrolment"
        - "publicKey"
    ResponseError:
      type: "object"
      properties:
        reason:
          type: "string"
          description: "Human-readable explanation of the error. Intended for logs and operators; the wording may change between versions, so do not parse it."
          example: "Validation failed"
        code:
          type: "string"
          enum:
            - "DHCG::UNKNOWN"
            - "DHCG::UNAUTHORIZED"
            - "DHCG::ROUTE_NOT_FOUND"
            - "ID::NO_PRIVATE_KEY"
            - "ID::IAM_INIT_ERROR"
            - "ID::NO_BALANCE"
            - "ID::INVALID_PRIVATE_KEY"
            - "IAM::NOT_INITIALIZED"
            - "BIP39::MNEMONIC_DOES_NOT_EXISTS"
            - "BIP39::ASSOCIATION_KEY_NOT_AVAILABLE"
            - "MB::UNABLE_TO_LOGIN"
            - "MB::ERROR"
            - "MB::UNKNOWN"
            - "MB::ACK_PENDING"
            - "CHANNEL::ALREADY_EXISTS"
            - "CHANNEL::NOT_FOUND"
            - "CHANNEL::RESTRICTED_FIELDS_UPDATE"
            - "CHANNEL::TYPE_INVALID"
            - "CHANNEL::CHANNEL_TOPIC_SCHEMA_TYPE_INVALID"
            - "CHANNEL::MESSAGE_FORMS_ONLY"
            - "TOPIC::NOT_FOUND"
            - "TOPIC::NOT_RELATED_TO_CHANNEL"
            - "DDHUB::NOT_CONTROLLABLE"
            - "DDHUB::UNSUPPORTED_CONTROL_TYPE"
            - "DDHUB::UNHEALTHY"
            - "DDHUB::REQUEST_FAILED"
            - "DDHUB::LOGIN_FAILED"
            - "DDHUB::UNAUTHORIZED"
            - "DDHUB::FORBIDDEN_RESOURCE"
            - "DDHUB::CHANNEL_UNAUTHORIZED"
            - "DDHUB::CHANNEL_NOT_FOUND"
            - "DDHUB::NO_SUBSCRIPTIONS"
            - "DDHUB::INVALID_PAYLOAD"
            - "SIG::NO_MATCH"
            - "MESSAGING::REQ_LOCK"
            - "MESSAGING::RECIPIENTS_NOT_PRESENT"
            - "MESSAGING::MESSAGES_NOT_PRESENT"
            - "MESSAGING::TOPIC_OWNER_AND_NAME_REQUIRED"
            - "MESSAGING::DESCRPTION_FAILED"
            - "MESSAGING::PAYLOAD JSON PARSE FAILED"
            - "MESSAGING:MAXIMUM_NUMBER_OF_CLIENTS_REACHED"
            - "MESSAGING::FILE_SIZE_GREATER_THEN_100_MB"
            - "MESSAGING::FILE_TYPE_NOT_MATCHED"
            - "MESSAGING::FILE_NOT_FOUND"
            - "MESSAGING::FILE_NAME_INVALID"
            - "SECRETS_ENGINE::INVALID"
            - "VALIDATION::FAILED"
            - "CONTACT::NOT_FOUND"
          description: "Stable, namespaced error code. Use this value for programmatic error handling.\n\n- `DHCG::UNKNOWN`: unexpected error. Also returned for errors that the gateway does not map explicitly.\n- `DHCG::UNAUTHORIZED`: missing or invalid credentials, a role that may not call the endpoint, or mTLS could not be configured (HTTP 403).\n- `DHCG::ROUTE_NOT_FOUND`: the route or the requested resource does not exist (HTTP 404).\n- `VALIDATION::FAILED`: the request did not pass validation; see `additionalDetails.errors` (HTTP 400).\n- `ID::*`: gateway identity errors, for example no private key configured yet (`ID::NO_PRIVATE_KEY`) or an invalid private key (`ID::INVALID_PRIVATE_KEY`).\n- `IAM::*`: the gateway identity is not loaded yet, usually because none is set up.\n- `BIP39::*`: association key mnemonic or key not available.\n- `MB::*` and `DDHUB::*`: the EWDS Message Broker rejected or failed the request, or could not be reached.\n- `CHANNEL::*`: channel configuration errors (already exists, not found, restricted field update, invalid type or topic schema type, message forms only).\n- `TOPIC::*`: topic not found or not related to the channel.\n- `MESSAGING::*`: message and file exchange errors (missing recipients, decryption failed, file too large or of the wrong type, file not found, maximum number of clients reached, request lock).\n- `SIG::NO_MATCH`: the message signature does not match the sender DID document.\n- `SECRETS_ENGINE::INVALID`: the gateway's secret storage is not configured correctly (an operator setting, not a request error).\n- `CONTACT::NOT_FOUND`: the address book contact does not exist."
          example: "VALIDATION::FAILED"
        additionalDetails:
          type: "object"
          description: "Extra details, when available.\n- `VALIDATION::FAILED`: `{ \"errors\": [...] }`, a list of the rules that failed.\n- Message Broker errors: the error the broker returned."
          additionalProperties: true
          example:
            errors:
              - "fqcn must be a string"
      required:
        - "reason"
        - "code"
    ResponseErrorDto:
      type: "object"
      properties:
        err:
          description: "Error details."
          allOf:
            - $ref: "#/components/schemas/ResponseError"
        statusCode:
          type: "number"
          description: "HTTP status code of the response, repeated in the body for convenience."
          example: 400
        timestamp:
          type: "string"
          format: "date-time"
          description: "Time the error was produced, in ISO 8601 (UTC)."
          example: "2026-01-01T00:00:00.000Z"
      required:
        - "err"
        - "statusCode"
        - "timestamp"
    ClaimResponseDto:
      type: "object"
      properties:
        namespace:
          type: "string"
          description: "Full role namespace: `<role>.roles.<application namespace>`."
          example: "user.roles.ddhub.apps.energyweb.iam.ewc"
        status:
          type: "string"
          enum:
            - "NOT_ENROLLED"
            - "AWAITING_APPROVAL"
            - "APPROVED"
            - "REJECTED"
            - "SYNCED"
          description: "Status of the request:\n- `AWAITING_APPROVAL`: waiting for an issuer.\n- `APPROVED`: approved by an issuer.\n- `REJECTED`: rejected by an issuer."
          example: "APPROVED"
        syncedToDidDoc:
          type: "boolean"
          description: "`true` when the role is published in the DID document and active. An approved role with `false` is published within about a minute."
          example: true
      required:
        - "namespace"
        - "status"
        - "syncedToDidDoc"
    ClaimsResponseDto:
      type: "object"
      properties:
        did:
          type: "string"
          description: "DID of the gateway identity (claim subject)."
          example: "did:ethr:volta:0xfeFBb03EFc1054Cc4e3Fbf36362689cc1F5924a8"
        claims:
          description: "A list of claims held for the gateway DID. The same role can appear more than once if it was requested several times."
          type: "array"
          items:
            $ref: "#/components/schemas/ClaimResponseDto"
      required:
        - "did"
        - "claims"
    CreateIdentityDto:
      type: "object"
      properties:
        privateKey:
          type: "string"
          description: "Private key that becomes the gateway identity.\n- 64 hex characters, with or without `0x`.\n- Its address must hold funds.\n- Stored securely; never returned."
          example: "0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    UploadCertificateBodyDto:
      type: "object"
      properties:
        certificate:
          type: "string"
          format: "binary"
          description: "The certificate of the gateway, as a PEM file (it starts with `-----BEGIN CERTIFICATE-----`). Required."
        privateKey:
          type: "string"
          format: "binary"
          description: "The private key that belongs to `certificate`, as a PEM file without a password. Required. It is stored securely and never returned by the API."
        caCertificate:
          type: "string"
          format: "binary"
          description: "Optional PEM file. Only for a Message Broker with a private certificate authority.\n- Leaving it out removes one uploaded earlier."
      required:
        - "certificate"
        - "privateKey"
    GetChannelMessagesCountDto:
      type: "object"
      properties:
        count:
          type: "number"
          description: "Number of messages stored for the channel: sent for `pub`, received for other types."
          minimum: 0
          example: 5
        fqcn:
          type: "string"
          description: "FQCN of the channel the count belongs to."
          example: "ewds.market.operator.pub"
      required:
        - "count"
        - "fqcn"
    TopicDto:
      type: "object"
      properties:
        topicName:
          type: "string"
          description: "Topic name, exactly as registered on the message broker."
          example: "operatorEnvelope"
        owner:
          type: "string"
          description: "Topic owner: the application namespace the topic belongs to."
          example: "ddhub.apps.energyweb.iam.ewc"
      required:
        - "topicName"
        - "owner"
    ResponseTopicDto:
      type: "object"
      properties:
        topicName:
          type: "string"
          description: "Topic name, exactly as registered on the message broker. This is the topic to reply on."
          example: "operatorEnvelope"
        owner:
          type: "string"
          description: "Topic owner: the application namespace the topic belongs to. Owner of the topic to reply on."
          example: "ddhub.apps.energyweb.iam.ewc"
        responseTopicId:
          type: "string"
          description: "Id of the topic of incoming messages that should be answered on `topicName` / `owner`."
          example: "622fed6e4258501225095045"
      required:
        - "topicName"
        - "owner"
        - "responseTopicId"
    ChannelConditionsDto:
      type: "object"
      properties:
        dids:
          description: "DIDs allowed on the channel (recipients for `pub` and `upload`).\n- Format: `did:<method>:[<chain>:]0x<40 hex characters>`.\n- Send `[]` when not used."
          example:
            - "did:ethr:volta:0x09Df5d33f1242E1b8aA5E0E0F6BfA687E6846993"
          type: "array"
          items:
            type: "string"
        roles:
          description: "Roles whose holders are allowed on the channel (any of the roles).\n- Lowercase letters, digits and dots, 1 to 255 characters.\n- New holders appear within about a minute.\n- Send `[]` when not used."
          example:
            - "marketoperator.roles.ddhub.apps.energyweb.iam.ewc"
          type: "array"
          items:
            type: "string"
        topics:
          description: "Topics of the channel, by name and owner.\n- Each must exist on the Message Broker (`TOPIC::NOT_FOUND`).\n- `JSD7` or `XML` for `pub` and `sub`; `XSD6`, `CSV` or `TSV` for `upload` and `download`.\n- Each topic once. Send `[]` for none."
          type: "array"
          items:
            $ref: "#/components/schemas/TopicDto"
        responseTopics:
          description: "Reply mapping: messages on `responseTopicId` should be answered on `topicName` / `owner`.\n- Stored only; messages are not routed by it.\n- Optional on create; required on update (send `[]` when unused)."
          type: "array"
          items:
            $ref: "#/components/schemas/ResponseTopicDto"
      required:
        - "dids"
        - "roles"
        - "topics"
        - "responseTopics"
    CreateChannelDto:
      type: "object"
      properties:
        fqcn:
          type: "string"
          description: "Unique name of the channel in this gateway.\n- Lowercase letters, digits and dots, 1 to 255 characters.\n- No upper case, spaces, dashes or underscores."
          example: "ewds.market.operator.pub"
          pattern: "^[a-z0-9.]{1,255}$"
          minLength: 1
          maxLength: 255
        useAnonymousExtChannel:
          type: "boolean"
          description: "Exchange messages with parties addressed by association keys instead of DIDs. Cannot be changed later.\n- `true`, `pub`: sending works without recipients (use `anonymousRecipient`); never encrypted.\n- `true`, `sub` / `download`: messages for the current association key, not checked or decrypted.\n- `false` (default): normal messaging between DIDs."
          example: false
          default: false
        messageForms:
          type: "boolean"
          description: "Keep a copy of the messages of this channel. Cannot be changed later.\n- `pub`: sent messages are kept.\n- `sub`: received messages are kept.\n- `upload`: the original file is kept.\n- `download`: received file messages are kept.\n- Message counts work only for channels with this enabled.\n- `false` (default): nothing is kept."
          example: true
          default: false
        payloadEncryption:
          type: "boolean"
          description: "Encrypt what is sent on this channel.\n- `true`: only the recipients can read the messages or files (`pub` and `upload`).\n- `false`: sent in clear text, still signed.\n- Ignored on anonymous external channels and on `sub` / `download` channels."
          example: true
        type:
          type: "string"
          description: "Direction of the channel. Cannot be changed later.\n- `pub`: send messages. Topics `JSD7` or `XML`.\n- `sub`: receive messages. Topics `JSD7` or `XML`.\n- `upload`: send files. Topics `XSD6`, `CSV` or `TSV`.\n- `download`: receive files. Topics `XSD6`, `CSV` or `TSV`."
          enum:
            - "sub"
            - "pub"
            - "download"
            - "upload"
          example: "pub"
        conditions:
          description: "Who can exchange data on the channel (`dids`, `roles`) and on which topics (`topics`, `responseTopics`).\n- Send `conditions` and `conditions.topics` even when empty (`[]`)."
          allOf:
            - $ref: "#/components/schemas/ChannelConditionsDto"
      required:
        - "fqcn"
        - "payloadEncryption"
        - "type"
        - "conditions"
    ChannelTopic:
      type: "object"
      properties:
        topicName:
          type: "string"
          description: "Topic name, exactly as registered on the message broker."
          example: "operatorEnvelope"
        owner:
          type: "string"
          description: "Topic owner: the application namespace the topic belongs to."
          example: "ddhub.apps.energyweb.iam.ewc"
        topicId:
          type: "string"
          description: "Id of the topic. The same for all its versions."
          example: "622fed6e4258501225095045"
        schemaType:
          type: "string"
          description: "Type of the topic: `JSD7` or `XML` (messages), `XSD6`, `CSV` or `TSV` (files). May be absent on old channels."
          enum:
            - "JSD7"
            - "XML"
            - "XSD6"
            - "CSV"
            - "TSV"
          example: "JSD7"
      required:
        - "topicName"
        - "owner"
        - "topicId"
    ChannelResponseTopic:
      type: "object"
      properties:
        topicName:
          type: "string"
          description: "Topic name, exactly as registered on the message broker. Topic to reply on."
          example: "operatorEnvelope"
        topicOwner:
          type: "string"
          description: "Topic owner: the application namespace the topic belongs to. Owner of the topic to reply on."
          example: "ddhub.apps.energyweb.iam.ewc"
        topicId:
          type: "string"
          description: "Message broker id of the topic to reply on (`topicName` / `topicOwner`), resolved when the channel was saved."
          example: "622fed6e4258501225095045"
        responseTopicId:
          type: "string"
          description: "Message broker id of the topic of incoming messages that should be answered on `topicId`."
          example: "622fed6e4258501225095046"
      required:
        - "topicName"
        - "topicOwner"
        - "topicId"
        - "responseTopicId"
    ChannelConditions:
      type: "object"
      properties:
        dids:
          description: "DIDs allowed on the channel (recipients for `pub` and `upload`).\n- Format: `did:<method>:[<chain>:]0x<40 hex characters>`.\n- Send `[]` when not used."
          example:
            - "did:ethr:volta:0x09Df5d33f1242E1b8aA5E0E0F6BfA687E6846993"
          type: "array"
          items:
            type: "string"
        roles:
          description: "Roles whose holders are allowed on the channel (any of the roles).\n- Lowercase letters, digits and dots, 1 to 255 characters.\n- New holders appear within about a minute.\n- Send `[]` when not used."
          example:
            - "marketoperator.roles.ddhub.apps.energyweb.iam.ewc"
          type: "array"
          items:
            type: "string"
        qualifiedDids:
          description: "DIDs allowed on the channel: the listed DIDs plus the holders of the listed roles.\n- For `pub` and `upload`, these are the recipients.\n- Updated about once a minute; empty until the gateway identity is set up.\n- Read only."
          example:
            - "did:ethr:volta:0x09Df5d33f1242E1b8aA5E0E0F6BfA687E6846993"
            - "did:ethr:volta:0x3Ce3B60427b4Bf0Ce366d9963BeC5ef3CBD06ad5"
          type: "array"
          items:
            type: "string"
        topics:
          description: "Topics carried by the channel, with their message broker ids. Topics deleted on the message broker are removed from this list within about a minute."
          type: "array"
          items:
            $ref: "#/components/schemas/ChannelTopic"
        responseTopics:
          description: "Reply mapping: messages received on `responseTopicId` should be answered on `topicId`."
          type: "array"
          items:
            $ref: "#/components/schemas/ChannelResponseTopic"
      required:
        - "dids"
        - "roles"
        - "qualifiedDids"
        - "topics"
        - "responseTopics"
    GetChannelResponseDto:
      type: "object"
      properties:
        fqcn:
          type: "string"
          description: "Unique name of the channel in this gateway."
          example: "ewds.market.operator.pub"
        messageForms:
          type: "boolean"
          description: "Keep a copy of the messages of this channel. Cannot be changed later.\n- `pub`: sent messages are kept.\n- `sub`: received messages are kept.\n- `upload`: the original file is kept.\n- `download`: received file messages are kept.\n- Message counts work only for channels with this enabled.\n- `false` (default): nothing is kept."
          example: false
          default: false
        payloadEncryption:
          type: "boolean"
          description: "Encrypt what is sent on this channel.\n- `true`: only the recipients can read the messages or files (`pub` and `upload`).\n- `false`: sent in clear text, still signed.\n- Ignored on anonymous external channels and on `sub` / `download` channels."
          example: true
          default: true
        type:
          type: "string"
          description: "Direction of the channel. Cannot be changed later.\n- `pub`: send messages. Topics `JSD7` or `XML`.\n- `sub`: receive messages. Topics `JSD7` or `XML`.\n- `upload`: send files. Topics `XSD6`, `CSV` or `TSV`.\n- `download`: receive files. Topics `XSD6`, `CSV` or `TSV`."
          enum:
            - "sub"
            - "pub"
            - "download"
            - "upload"
          example: "pub"
        useAnonymousExtChannel:
          type: "boolean"
          description: "Exchange messages with parties addressed by association keys instead of DIDs. Cannot be changed later.\n- `true`, `pub`: sending works without recipients (use `anonymousRecipient`); never encrypted.\n- `true`, `sub` / `download`: messages for the current association key, not checked or decrypted.\n- `false` (default): normal messaging between DIDs."
          default: false
          example: false
        conditions:
          description: "Channel conditions: allowed DIDs and roles, the resolved `qualifiedDids`, and the topics of the channel."
          allOf:
            - $ref: "#/components/schemas/ChannelConditions"
        createdDate:
          type: "string"
          description: "When the channel was created (ISO 8601, UTC)."
          format: "date-time"
          example: "2026-03-22T14:27:00.027Z"
        updatedDate:
          type: "string"
          description: "When the channel last changed (ISO 8601, UTC), for example by an update or a change of `qualifiedDids`."
          format: "date-time"
          example: "2026-03-22T14:28:00.027Z"
      required:
        - "fqcn"
        - "messageForms"
        - "payloadEncryption"
        - "type"
        - "useAnonymousExtChannel"
        - "conditions"
        - "createdDate"
        - "updatedDate"
    GetChannelQualifiedDidsDto:
      type: "object"
      properties:
        fqcn:
          type: "string"
          description: "FQCN of the channel."
          example: "ewds.market.operator.pub"
        qualifiedDids:
          description: "DIDs allowed on the channel: the listed DIDs plus the holders of the listed roles.\n- For `pub` and `upload`, these are the recipients.\n- Updated about once a minute; empty until the gateway identity is set up."
          example:
            - "did:ethr:volta:0x09Df5d33f1242E1b8aA5E0E0F6BfA687E6846993"
            - "did:ethr:volta:0x3Ce3B60427b4Bf0Ce366d9963BeC5ef3CBD06ad5"
          type: "array"
          items:
            type: "string"
        updatedAt:
          type: "string"
          description: "When the channel last changed (ISO 8601)."
          example: "2026-03-22T14:27:00.027Z"
          format: "date-time"
      required:
        - "fqcn"
        - "qualifiedDids"
        - "updatedAt"
    UpdateChannelDto:
      type: "object"
      properties:
        type:
          type: "string"
          description: "Must equal the current type of the channel (`CHANNEL::RESTRICTED_FIELDS_UPDATE` otherwise)."
          enum:
            - "sub"
            - "pub"
            - "download"
            - "upload"
          example: "pub"
        useAnonymousExtChannel:
          type: "boolean"
          description: "Omit it, or send the current value (`CHANNEL::RESTRICTED_FIELDS_UPDATE` otherwise)."
          example: false
        messageForms:
          type: "boolean"
          description: "Ignored: cannot be changed after creation."
          example: true
        payloadEncryption:
          type: "boolean"
          description: "Encrypt what is sent on this channel from now on.\n- `true`: only the recipients can read the messages or files (`pub` and `upload`).\n- `false`: sent in clear text, still signed.\n- Ignored on anonymous external channels and on `sub` / `download` channels."
          example: true
        conditions:
          description: "New `dids`, `roles`, `topics` and `responseTopics`. Each list replaces the current one.\n- Send `conditions`, `topics` and `responseTopics` even when empty (`[]`)."
          allOf:
            - $ref: "#/components/schemas/ChannelConditionsDto"
      required:
        - "type"
        - "payloadEncryption"
        - "conditions"
    GetSentMessageRecipientsResponseDto:
      type: "object"
      properties:
        did:
          type: "string"
          description: "DID of the recipient gateway."
          example: "did:ethr:volta:0x782aB0383Bfc807439d8EE29516937B47815d697"
        alias:
          type: "string"
          description: "Name of the recipient in the local address book. Absent when the DID has no address book entry."
          example: "Distribution Network Operator A"
        failed:
          type: "boolean"
          description: "`true` when the message broker did not report status code `200` for this recipient."
          example: false
        messageId:
          type: "string"
          description: "Message ID of the copy for this recipient. Replies from this recipient use it as `initiatingMessageId`."
          example: "657a1f0c2b3e4d5f6a7b8c9d"
      required:
        - "did"
        - "failed"
        - "messageId"
    GetSentMessageResponseDto:
      type: "object"
      properties:
        clientGatewayMessageId:
          type: "string"
          format: "uuid"
          example: "f923afb7-e334-419c-a72c-a60b293184ea"
          description: "ID of the send request (UUID)."
        initiatingMessageId:
          type: "string"
          example: "657a1f0c2b3e4d5f6a7b8c9c"
          description: "Message ID of the received message this message replied to. Absent when it was not a reply; always absent for files."
        initiatingTransactionId:
          type: "string"
          example: "8ac55aa7-7d6d-438a-98bd-376079903c7b"
          description: "Transaction ID of the conversation this message replied to. Absent when it was not a reply; always absent for files."
        topicId:
          type: "string"
          example: "62545547fe37f174d7715ff3"
          description: "Message broker ID of the topic."
        topicName:
          type: "string"
          example: "getOperatingEnvelope"
          description: "Topic name."
        topicOwner:
          type: "string"
          example: "ddhub.apps.energyweb.iam.ewc"
          description: "Application namespace that owns the topic."
        topicVersion:
          type: "string"
          example: "1.0.0"
          description: "Topic version the message was sent with."
        transactionId:
          type: "string"
          example: "45d5a89f-7c2c-48b0-ae9a-54f4128e818f"
          description: "Transaction ID given by the caller when sending, if any."
        signature:
          type: "string"
          example: "0x0abc6026b01856a756de47ec6f44d9c14fe69009bbf3b9b6cf522d8d783a1c654425848381affca5dab9284d8715fa2f9e34155374bafd923d75c219496cbe161c"
          description: "Signature this gateway added to the message or file."
        payloadEncryption:
          type: "boolean"
          example: true
          description: "Whether the payload or file was encrypted in transit (the channel had `payloadEncryption` enabled and was not an anonymous external channel)."
        payload:
          type: "string"
          example: "{\"siteId\":\"NMI-0001\",\"limitKw\":49.5,\"validFrom\":\"2024-03-31T10:00:00Z\"}"
          description: "The original payload. Empty for files."
        timestampNanos:
          type: "number"
          description: "Send time in nanoseconds since the Unix epoch (millisecond precision, recorded by this gateway)."
          example: 1711878524357000000
        timestampISO:
          type: "string"
          description: "`timestampNanos` as an ISO 8601 date-time."
          format: "date-time"
          example: "2024-03-31T09:48:44.357Z"
        senderDid:
          type: "string"
          example: "did:ethr:volta:0x09Df5d33f1242E1b8aA5E0E0F6BfA687E6846993"
          description: "DID of this gateway at the time of sending."
        fqcn:
          type: "string"
          example: "ddhub.apps.energyweb.channel.operating.envelope"
          description: "FQCN of the channel the message was sent through."
        relatedMessagesCount:
          type: "number"
          example: 1
          description: "Number of received replies to this message."
        isFile:
          type: "boolean"
          example: false
          description: "`true` for a file, `false` for a message."
        totalRecipients:
          type: "number"
          example: 3
          description: "Number of recipients the message broker reported for the send request (`recipients.total` of the send response)."
        totalSent:
          type: "number"
          example: 2
          description: "Number of recipients the message was delivered to (`recipients.sent` of the send response)."
        totalFailed:
          type: "number"
          example: 1
          description: "Number of recipients the delivery failed for (`recipients.failed` of the send response)."
        createdDate:
          type: "string"
          description: "When this gateway stored the message."
          format: "date-time"
          example: "2024-03-31T09:48:44.400Z"
        updatedDate:
          type: "string"
          description: "When the stored record was last updated."
          format: "date-time"
          example: "2024-03-31T09:48:44.400Z"
        messagesIds:
          example:
            - "657a1f0c2b3e4d5f6a7b8c9d"
            - "657a1f0c2b3e4d5f6a7b8c9e"
          description: "A list of message IDs, one for each recipient the message was sent to."
          type: "array"
          items:
            type: "string"
        recipients:
          description: "A list of delivery results, one for each recipient the message was delivered to."
          type: "array"
          items:
            $ref: "#/components/schemas/GetSentMessageRecipientsResponseDto"
      required:
        - "clientGatewayMessageId"
        - "topicId"
        - "topicVersion"
        - "transactionId"
        - "signature"
        - "payloadEncryption"
        - "payload"
        - "timestampNanos"
        - "timestampISO"
        - "senderDid"
        - "fqcn"
        - "relatedMessagesCount"
        - "isFile"
        - "totalRecipients"
        - "totalSent"
        - "totalFailed"
        - "createdDate"
        - "updatedDate"
        - "recipients"
    GetReceivedMessageResponseDto:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Message ID. Use it to mark the message as read, or as `initiatingMessageId` when replying."
          example: "657a1f0c2b3e4d5f6a7b8c9d"
        topicId:
          type: "string"
          description: "Message broker ID of the topic."
          example: "62545547fe37f174d7715ff3"
        replyMessagesCount:
          type: "number"
          example: 2
          description: "Number of replies this gateway sent to this message."
          default: 0
        topicName:
          type: "string"
          description: "Topic name."
          example: "getOperatingEnvelope"
        topicOwner:
          type: "string"
          description: "Application namespace that owns the topic."
          example: "ddhub.apps.energyweb.iam.ewc"
        topicVersion:
          type: "string"
          description: "Topic version the sender used."
          example: "1.0.0"
        topicSchemaType:
          type: "string"
          description: "Schema type of the topic. This endpoint currently always returns `JSD7`, whatever the real schema type of the topic is."
          enum:
            - "JSD7"
            - "XML"
            - "XSD6"
            - "CSV"
            - "TSV"
          example: "JSD7"
        payload:
          type: "string"
          description: "The payload as received, decrypted where possible."
          example: "{\"siteId\":\"NMI-0001\",\"limitKw\":49.5,\"validFrom\":\"2024-03-31T10:00:00Z\"}"
        signature:
          type: "string"
          description: "Sender's signature (hex) as received."
          example: "0x0abc6026b01856a756de47ec6f44d9c14fe69009bbf3b9b6cf522d8d783a1c654425848381affca5dab9284d8715fa2f9e34155374bafd923d75c219496cbe161c"
        sender:
          type: "string"
          description: "DID of the sending gateway."
          example: "did:ethr:volta:0x03830466Ce257f9B798B0f27359D7639dFB6457D"
        senderAlias:
          type: "string"
          description: "Name of the sender in the local address book. Absent when the sender DID has no address book entry."
          example: "Distribution Network Operator A"
        timestampNanos:
          type: "number"
          description: "Message timestamp in nanoseconds since the Unix epoch (stored with millisecond precision)."
          example: 1711878524357000000
        timestampISO:
          type: "string"
          description: "`timestampNanos` as an ISO 8601 date-time."
          format: "date-time"
          example: "2024-03-31T09:48:44.357Z"
        transactionId:
          type: "string"
          description: "Transaction ID set by the sender, if any."
          example: "45d5a89f-7c2c-48b0-ae9a-54f4128e818f"
        initiatingMessageId:
          type: "string"
          description: "Message ID of the message this one replies to, as set by the sender. Absent for messages that are not replies."
          example: "657a1f0c2b3e4d5f6a7b8c9c"
        initiatingTransactionId:
          type: "string"
          description: "Transaction ID of the conversation this message replies to, as set by the sender. Absent for messages that are not replies."
          example: "8ac55aa7-7d6d-438a-98bd-376079903c7b"
        payloadEncryption:
          type: "boolean"
          description: "Whether the sender encrypted the payload in transit."
          example: true
        clientGatewayMessageId:
          type: "string"
          description: "UUID generated by the sending gateway for its send request."
          format: "uuid"
          example: "0b271eb8-1e21-4817-95af-7951649360ed"
        signatureValid:
          type: "string"
          description: "Signature check of the stored message:\n- `SUCCESS`: matches.\n- `FAILED`: does not match. Encrypted messages usually show `FAILED` here even when the check passed on arrival."
          enum:
            - "FAILED"
            - "SUCCESS"
            - "NOT_REQUIRED"
            - "NOT_PERFORMED"
            - "REQUIRED_NOT_PERFORMED"
            - "ERROR"
          example: "SUCCESS"
        decryption:
          type: "object"
          description: "Decryption result. Always `{ \"status\": \"NOT_REQUIRED\" }` here, because stored payloads are already in plaintext."
          properties:
            status:
              type: "string"
              enum:
                - "FAILED"
                - "SUCCESS"
                - "NOT_REQUIRED"
                - "NOT_PERFORMED"
                - "REQUIRED_NOT_PERFORMED"
                - "ERROR"
              description: "Always present; always `NOT_REQUIRED` for stored messages."
              example: "NOT_REQUIRED"
            errorMessage:
              type: "string"
              description: "Never set for stored messages."
        relatedMessagesCount:
          type: "number"
          description: "Number of other stored messages in the same conversation."
          example: 5
        isRead:
          type: "boolean"
          description: "`true` once any user marked the message as read."
          example: false
      required:
        - "id"
        - "topicId"
        - "replyMessagesCount"
        - "topicName"
        - "topicOwner"
        - "topicVersion"
        - "topicSchemaType"
        - "payload"
        - "signature"
        - "sender"
        - "timestampNanos"
        - "timestampISO"
        - "transactionId"
        - "payloadEncryption"
        - "clientGatewayMessageId"
        - "signatureValid"
        - "decryption"
        - "isRead"
    AckMessagesRequestDto:
      type: "object"
      properties:
        messagesIds:
          example:
            - "657a1f0c2b3e4d5f6a7b8c9d"
            - "657a1f0c2b3e4d5f6a7b8c9e"
          minItems: 1
          description: "IDs of received messages to mark as read.\n- At least one ID.\n- Unknown IDs are accepted."
          type: "array"
          items:
            type: "string"
      required:
        - "messagesIds"
    GetMessagesResponseDto:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Message ID. Use it to mark the message as read, or as `initiatingMessageId` when replying."
          example: "657a1f0c2b3e4d5f6a7b8c9d"
        topicName:
          type: "string"
          description: "Topic name. Empty when the topic is unknown to this gateway."
          example: "getOperatingEnvelope"
        topicOwner:
          type: "string"
          description: "Application namespace that owns the topic. Empty when the topic is unknown to this gateway."
          example: "ddhub.apps.energyweb.iam.ewc"
        topicVersion:
          type: "string"
          description: "Topic version the sender used."
          example: "1.0.0"
        topicSchemaType:
          type: "string"
          description: "Type of the payload:\n- `JSD7`: JSON, as a string.\n- `XSD6`, `XML`: XML.\n- `CSV`, `TSV`: comma or tab separated values.\n- Empty when the topic is unknown to this gateway."
          enum:
            - "JSD7"
            - "XML"
            - "XSD6"
            - "CSV"
            - "TSV"
          example: "JSD7"
        payload:
          type: "string"
          description: "The message content.\n- Decrypted when it was encrypted (see `decryption`).\n- Still encrypted when `decryption.status` is `NOT_PERFORMED` or `ERROR`.\n- On a `download` channel: a file notification with the `fileId`."
          example: "{\"siteId\":\"NMI-0001\",\"limitKw\":49.5,\"validFrom\":\"2024-03-31T10:00:00Z\"}"
        signature:
          type: "string"
          description: "Sender's signature (hex) over the transmitted payload, created with the sender gateway key. See `signatureValid` for the check result."
          example: "0x0abc6026b01856a756de47ec6f44d9c14fe69009bbf3b9b6cf522d8d783a1c654425848381affca5dab9284d8715fa2f9e34155374bafd923d75c219496cbe161c"
        sender:
          type: "string"
          description: "DID of the sending gateway."
          example: "did:ethr:volta:0x03830466Ce257f9B798B0f27359D7639dFB6457D"
        timestampNanos:
          type: "number"
          description: "Message broker timestamp of the message, in nanoseconds since the Unix epoch."
          example: 1711878524357000000
        timestampISO:
          type: "string"
          description: "`timestampNanos` as an ISO 8601 date-time."
          format: "date-time"
          example: "2024-03-31T09:48:44.357Z"
        transactionId:
          type: "string"
          description: "Transaction ID set by the sender. Use it as `initiatingTransactionId` when replying."
          example: "45d5a89f-7c2c-48b0-ae9a-54f4128e818f"
        initiatingMessageId:
          type: "string"
          description: "Message ID of the message this one replies to, as set by the sender. Absent for messages that are not replies."
          example: "657a1f0c2b3e4d5f6a7b8c9c"
        initiatingTransactionId:
          type: "string"
          description: "Transaction ID of the conversation this message replies to, as set by the sender. Absent for messages that are not replies."
          example: "8ac55aa7-7d6d-438a-98bd-376079903c7b"
        payloadEncryption:
          type: "boolean"
          description: "Whether the sender encrypted the payload (the sending channel had `payloadEncryption` enabled)."
          example: true
        clientGatewayMessageId:
          type: "string"
          description: "UUID generated by the sending gateway for this send request. It is the same for all recipients of the message."
          format: "uuid"
          example: "0b271eb8-1e21-4817-95af-7951649360ed"
        topicId:
          type: "string"
          description: "Message broker ID of the topic."
          example: "62545547fe37f174d7715ff3"
        signatureValid:
          type: "string"
          description: "Whether the message really comes from the sender:\n- `SUCCESS`: yes.\n- `FAILED`: no; do not trust the message. It is not decrypted.\n- `NOT_REQUIRED`: not checked (file notifications, anonymous external channels).\n- `NOT_PERFORMED`: not checked, because the topic is unknown to this gateway.\n- `ERROR`: the message could not be processed; see `decryption.errorMessage`.\n- `REQUIRED_NOT_PERFORMED`: not used."
          enum:
            - "FAILED"
            - "SUCCESS"
            - "NOT_REQUIRED"
            - "NOT_PERFORMED"
            - "REQUIRED_NOT_PERFORMED"
            - "ERROR"
          example: "SUCCESS"
        decryption:
          type: "object"
          description: "Decryption result for this message."
          properties:
            status:
              type: "string"
              enum:
                - "FAILED"
                - "SUCCESS"
                - "NOT_REQUIRED"
                - "NOT_PERFORMED"
                - "REQUIRED_NOT_PERFORMED"
                - "ERROR"
              description: "Result of decrypting the payload:\n- `SUCCESS`: decrypted.\n- `NOT_REQUIRED`: was not encrypted.\n- `NOT_PERFORMED`: not decrypted, because the signature check failed or the topic is unknown; `payload` is still encrypted.\n- `ERROR`: could not be decrypted; see `errorMessage`. Usually the key has not arrived yet; try again later.\n- `FAILED`, `REQUIRED_NOT_PERFORMED`: not used.\n\nAlways present."
              example: "SUCCESS"
            errorMessage:
              type: "string"
              description: "Reason of the failure, only present when `status` is `ERROR`."
              example: "did:ethr:volta:0x03830466Ce257f9B798B0f27359D7639dFB6457D:0b271eb8-1e21-4817-95af-7951649360ed does not have symmetric key"
        relatedMessagesCount:
          type: "number"
          description: "Not used here."
          example: 5
      required:
        - "id"
        - "topicName"
        - "topicOwner"
        - "topicVersion"
        - "topicSchemaType"
        - "payload"
        - "signature"
        - "sender"
        - "timestampNanos"
        - "timestampISO"
        - "transactionId"
        - "payloadEncryption"
        - "clientGatewayMessageId"
        - "topicId"
        - "signatureValid"
        - "decryption"
    SendMessageDto:
      type: "object"
      properties:
        fqcn:
          type: "string"
          description: "Name of a `pub` channel (lowercase letters, digits and dots, 1 to 255 characters).\n- Its recipients get the message.\n- Its `payloadEncryption` decides whether the message is encrypted.\n- Its `messageForms` decides whether a copy is kept."
          pattern: "^[a-z0-9.]{1,255}$"
          maxLength: 255
          example: "ddhub.apps.energyweb.channel.operating.envelope"
        initiatingMessageId:
          type: "string"
          description: "When replying: the `id` of the received message."
          example: "657a1f0c2b3e4d5f6a7b8c9d"
        initiatingTransactionId:
          type: "string"
          description: "When replying: the `transactionId` of the received message."
          example: "8ac55aa7-7d6d-438a-98bd-376079903c7b"
        topicName:
          type: "string"
          example: "getOperatingEnvelope"
          description: "Topic name. With `topicOwner` and `topicVersion`, it must point to a topic of the channel."
        topicVersion:
          type: "string"
          example: "1.0.0"
          description: "Exact topic version (semantic version string) to send with. Recipients receive this version and use its schema."
        topicOwner:
          type: "string"
          example: "ddhub.apps.energyweb.iam.ewc"
          description: "Application namespace that owns the topic."
        transactionId:
          type: "string"
          example: "45d5a89f-7c2c-48b0-ae9a-54f4128e818f"
          description: "Optional ID of your choice. Recipients receive it unchanged, so you can use it to link or deduplicate messages."
        payload:
          type: "string"
          example: "{\"siteId\":\"NMI-0001\",\"limitKw\":49.5,\"validFrom\":\"2024-03-31T10:00:00Z\"}"
          description: "Message content, as a string.\n- `JSD7` topics: JSON that matches the topic schema; otherwise `422 DDHUB::INVALID_PAYLOAD`.\n- Other topic types: not checked.\n- The whole request is limited by `REQUEST_BODY_SIZE` (default 50 MB)."
        anonymousRecipient:
          description: "Association keys of extra, anonymous recipients (mainly for anonymous external channels).\n- Up to 25 unique entries, at most 255 characters each.\n- Messages to them are never encrypted."
          default: []
          maxItems: 25
          uniqueItems: true
          example: []
          type: "array"
          items:
            type: "string"
      required:
        - "fqcn"
        - "topicName"
        - "topicVersion"
        - "topicOwner"
        - "payload"
    Recipients:
      type: "object"
      properties:
        total:
          type: "number"
          description: "Number of recipient DIDs the message broker addressed (the channel qualified DIDs, plus anonymous recipients when given)."
          example: 3
        sent:
          type: "number"
          description: "Number of recipients the message was delivered to."
          example: 2
        failed:
          type: "number"
          description: "Number of recipients the delivery failed for. The HTTP request still succeeds when some or all recipients fail, so always check this value (and `status`)."
          example: 1
      required:
        - "total"
        - "sent"
        - "failed"
    Details:
      type: "object"
      properties:
        did:
          type: "string"
          description: "Recipient DID this entry refers to."
          example: "did:ethr:volta:0x09Df5d33f1242E1b8aA5E0E0F6BfA687E6846993"
        messageId:
          type: "string"
          description: "Message ID of the copy for this recipient. Absent when delivery failed."
          example: "657a1f0c2b3e4d5f6a7b8c9d"
        statusCode:
          type: "number"
          description: "HTTP-like status code reported by the message broker for this recipient. `200` means delivered; any other value is a failure."
          example: 200
    Status:
      type: "object"
      properties:
        details:
          description: "The recipients in this group."
          example:
            - did: "did:ethr:volta:0x09Df5d33f1242E1b8aA5E0E0F6BfA687E6846993"
              messageId: "657a1f0c2b3e4d5f6a7b8c9d"
              statusCode: 200
          type: "array"
          items:
            $ref: "#/components/schemas/Details"
        name:
          type: "string"
          description: "Name of the result group, as reported by the message broker:\n- `SENT`: recipients the message was delivered to.\n- `FAILED`: recipients the delivery failed for."
          example: "SENT"
      required:
        - "details"
        - "name"
    SendMessageResponseDto:
      type: "object"
      properties:
        clientGatewayMessageId:
          type: "string"
          description: "ID of the send request (UUID v4). The same for all recipients."
          format: "uuid"
          example: "0b271eb8-1e21-4817-95af-7951649360ed"
        did:
          type: "string"
          description: "DID field of the message broker send result, passed through unchanged."
          example: "did:ethr:volta:0x09Df5d33f1242E1b8aA5E0E0F6BfA687E6846993"
        recipients:
          description: "Delivery counters over all recipients."
          allOf:
            - $ref: "#/components/schemas/Recipients"
        status:
          description: "A list of results grouped by outcome (`SENT` or `FAILED`), each with its recipients."
          type: "array"
          items:
            $ref: "#/components/schemas/Status"
      required:
        - "clientGatewayMessageId"
        - "did"
        - "recipients"
        - "status"
    uploadMessageBodyDto:
      type: "object"
      properties:
        file:
          type: "string"
          format: "binary"
          description: "The CSV file.\n- Content type `text/csv`.\n- At most `MAX_FILE_SIZE` (default 100 MB).\n- The content is not checked against the topic schema."
        fqcn:
          type: "string"
          description: "Name of an `upload` channel (lowercase letters, digits and dots, 1 to 255 characters).\n- Its recipients get the file.\n- Its `payloadEncryption` decides whether the file is encrypted.\n- Its `messageForms` decides whether a copy is kept."
          pattern: "^[a-z0-9.]{1,255}$"
          maxLength: 255
          example: "ddhub.apps.energyweb.channel.meter.reads.upload"
        topicName:
          type: "string"
          example: "meterReadsCsv"
          description: "Topic name. Together with `topicOwner` and `topicVersion` it must identify a topic version known to the gateway and bound to the channel."
        topicVersion:
          type: "string"
          example: "1.0.0"
          description: "Exact topic version (semantic version string)."
        topicOwner:
          type: "string"
          example: "ddhub.apps.energyweb.iam.ewc"
          description: "Application namespace that owns the topic."
        transactionId:
          type: "string"
          example: "45d5a89f-7c2c-48b0-ae9a-54f4128e818f"
          description: "Optional ID of your choice. Recipients receive it unchanged."
      required:
        - "file"
        - "fqcn"
        - "topicName"
        - "topicVersion"
        - "topicOwner"
    GetAssociationKeysDto:
      type: "object"
      properties:
        associationKey:
          type: "string"
          description: "The association key itself (66 hex characters). Other parties can use it to send messages to this gateway instead of its DID."
          example: "03ced868821e185bc7f2aaa2f68b0b1d4b725259117edd1ef6fbccb08e4a4d2ef1"
        validTo:
          type: "string"
          description: "End of the validity window (exclusive): `validFrom` + `ASSOCIATION_KEY_INTERVAL` hours (default 24). From this moment the next key becomes current."
          format: "date-time"
          example: "2024-06-09T05:43:15.510Z"
        validFrom:
          type: "string"
          description: "Start of the validity window. For the first key it is the time it was generated; each following key starts at the `validTo` of the previous one."
          format: "date-time"
          example: "2024-06-08T05:43:15.510Z"
        isSent:
          type: "boolean"
          description: "`true` when the key is registered with the Message Broker. `false`: not yet, or registration failed."
          example: true
        sentDate:
          type: "string"
          description: "When the key was registered at the Message Broker (`isSent` became true). Null if it has not been registered."
          format: "date-time"
          nullable: true
          example: "2024-06-08T05:43:16.020Z"
        isShared:
          type: "boolean"
          description: "`true` when the key was shared on the association keys channel (`AK_FQCN`)."
          example: false
        sharedDate:
          type: "string"
          description: "When the key was last shared on the association keys channel. Null if it was never shared."
          format: "date-time"
          nullable: true
          example: "2024-06-08T05:44:00.000Z"
        iteration:
          type: "string"
          description: "Sequence label of the key, from its `validFrom` (`<YYYYMMDD>_<time>`). Keys are sorted by it."
          example: "20240608_54315"
        owner:
          type: "string"
          description: "DID of the gateway identity that owns the key."
          example: "did:ethr:volta:0x09Df5d33f1242E1b8aA5E0E0F6BfA687E6846993"
        createdDate:
          type: "string"
          description: "When the gateway created the key."
          format: "date-time"
          example: "2024-06-08T05:43:15.600Z"
        updatedDate:
          type: "string"
          description: "When the key record was last updated (registration or sharing state changed)."
          format: "date-time"
          example: "2024-06-08T05:44:00.000Z"
      required:
        - "associationKey"
        - "validTo"
        - "validFrom"
        - "isSent"
        - "sentDate"
        - "isShared"
        - "sharedDate"
        - "iteration"
        - "owner"
        - "createdDate"
        - "updatedDate"
    GetCurrentKeyDto:
      type: "object"
      properties:
        current:
          description: "Key valid now. Null when no key could be created (for example no identity)."
          nullable: true
          type: "object"
          allOf:
            - $ref: "#/components/schemas/GetAssociationKeysDto"
        next:
          nullable: true
          description: "Upcoming key; usually the same as `current`. Null only when `current` is null."
          type: "object"
          allOf:
            - $ref: "#/components/schemas/GetAssociationKeysDto"
      required:
        - "current"
        - "next"
    ApplicationDTO:
      type: "object"
      properties:
        appName:
          type: "string"
          description: "Name of the application as defined in its SSI-Hub application definition."
          example: "EWDS Demo Application"
        logoUrl:
          type: "string"
          description: "Logo URL from the SSI-Hub application definition. `null` when the definition has none."
          nullable: true
          example: "https://example.com/assets/app-logo.png"
        websiteUrl:
          type: "string"
          description: "Website URL from the SSI-Hub application definition. `null` when the definition has none."
          nullable: true
          example: "https://example.com"
        description:
          type: "string"
          description: "Free text description from the SSI-Hub application definition. `null` when the definition has none."
          nullable: true
          example: "Application owning the market data topics."
        createdDate:
          type: "string"
          description: "When this gateway first listed the application (ISO 8601)."
          format: "date-time"
          example: "2026-05-18T11:19:07.000Z"
        updatedDate:
          type: "string"
          description: "When this gateway last updated the entry (ISO 8601)."
          format: "date-time"
          example: "2026-05-18T11:20:07.000Z"
        namespace:
          type: "string"
          description: "SSI-Hub namespace of the application. Topics are owned by an application namespace (`owner` of a topic), so use this value wherever a topic owner is expected."
          nullable: true
          example: "ddhub.apps.energyweb.iam.ewc"
        roles:
          description: "Roles the gateway holds in the application:\n- `user`: uses the application (for example its topics in channels).\n- `topiccreator`: manages the topics of the application."
          example:
            - "user"
            - "topiccreator"
          type: "array"
          items:
            type: "string"
        topicsCount:
          type: "number"
          description: "Number of topics owned by the application namespace, as reported by the EWDS Message Broker at the last refresh. `0` when the broker reported none."
          nullable: true
          example: 4
      required:
        - "appName"
        - "logoUrl"
        - "websiteUrl"
        - "description"
        - "createdDate"
        - "updatedDate"
        - "namespace"
        - "roles"
        - "topicsCount"
    GetTopicDto:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Topic id assigned by the message broker when the topic was created. All versions of a topic share the same id."
          example: "62545547fe37f174d7715ff3"
        name:
          type: "string"
          description: "Topic name, unique within its owner namespace."
          example: "operatorEnvelope"
        schemaType:
          type: "string"
          description: "Type of data the topic carries:\n- `JSD7`: JSON, for `pub` and `sub` channels. Payloads are checked against the schema.\n- `XML`: XML, for `pub` and `sub` channels.\n- `XSD6`: XML files, for `upload` and `download` channels.\n- `CSV`, `TSV`: comma or tab separated files, for `upload` and `download` channels."
          enum:
            - "JSD7"
            - "XML"
            - "XSD6"
            - "CSV"
            - "TSV"
          example: "JSD7"
        schema:
          type: "string"
          description: "Schema of the version. In lists it is a JSON object, not a string."
          example: "{\"type\":\"object\",\"properties\":{\"data\":{\"type\":\"number\"}}}"
        version:
          type: "string"
          description: "Highest version of the topic (`MAJOR.MINOR.PATCH`)."
          example: "1.0.9"
        owner:
          type: "string"
          description: "Owner of the topic: the namespace of the application (in the Energy Web SSI-Hub) the topic belongs to."
          example: "ddhub.apps.energyweb.iam.ewc"
        tags:
          description: "Labels to group and filter topics. Shared by all versions."
          example:
            - "aggregator"
          type: "array"
          items:
            type: "string"
      required:
        - "id"
        - "name"
        - "schemaType"
        - "schema"
        - "version"
        - "owner"
        - "tags"
    PaginatedResponse:
      type: "object"
      properties:
        count:
          type: "number"
          description: "Total number of topics matching the filters (latest version of each topic counted once), across all pages."
          example: 12
        limit:
          type: "number"
          description: "Page size used for this response (the `limit` query parameter, default 5)."
          example: 5
          default: 5
        page:
          type: "number"
          description: "Page number of this response (the `page` query parameter, default 1)."
          example: 1
          default: 1
        records:
          description: "A list of topics on this page, each at its highest version, with its schema."
          type: "array"
          items:
            $ref: "#/components/schemas/GetTopicDto"
      required:
        - "count"
        - "records"
    GetTopicSearchDto:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Topic id assigned by the message broker when the topic was created. All versions of a topic share the same id."
          example: "62545547fe37f174d7715ff3"
        name:
          type: "string"
          description: "Topic name, unique within its owner namespace."
          example: "operatorEnvelope"
        schemaType:
          type: "string"
          description: "Type of data the topic carries:\n- `JSD7`: JSON, for `pub` and `sub` channels. Payloads are checked against the schema.\n- `XML`: XML, for `pub` and `sub` channels.\n- `XSD6`: XML files, for `upload` and `download` channels.\n- `CSV`, `TSV`: comma or tab separated files, for `upload` and `download` channels."
          enum:
            - "JSD7"
            - "XML"
            - "XSD6"
            - "CSV"
            - "TSV"
          example: "JSD7"
        owner:
          type: "string"
          description: "Owner of the topic: the namespace of the application (in the Energy Web SSI-Hub) the topic belongs to."
          example: "ddhub.apps.energyweb.iam.ewc"
        version:
          type: "string"
          description: "Version of this record (`MAJOR.MINOR.PATCH`)."
          example: "1.0.9"
        tags:
          description: "Labels to group and filter topics. Shared by all versions."
          example:
            - "aggregator"
          type: "array"
          items:
            type: "string"
        createdDate:
          type: "string"
          description: "When this gateway first saw the version (ISO 8601). Not returned when listing versions."
          format: "date-time"
          example: "2026-06-08T05:43:15.510Z"
        updatedDate:
          type: "string"
          description: "When this gateway last saw the version change (ISO 8601). Not returned when listing versions."
          format: "date-time"
          example: "2026-06-08T05:43:15.510Z"
      required:
        - "id"
        - "name"
        - "schemaType"
        - "owner"
        - "version"
        - "tags"
    PaginatedTopicResponse:
      type: "object"
      properties:
        count:
          type: "number"
          description: "Total number of versions of the topic, across all pages."
          example: 3
        limit:
          type: "number"
          description: "Page size used for this response (the `limit` query parameter, default 5)."
          example: 5
          default: 5
        page:
          type: "number"
          description: "Page number of this response (the `page` query parameter, default 1)."
          example: 1
          default: 1
        records:
          description: "A list of versions on this page, without the schema. Order not guaranteed."
          type: "array"
          items:
            $ref: "#/components/schemas/GetTopicSearchDto"
      required:
        - "count"
        - "records"
    PostTopicDto:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Topic id assigned by the message broker when the topic was created. All versions of a topic share the same id."
          example: "62545547fe37f174d7715ff3"
        name:
          type: "string"
          description: "Topic name, unique within its owner namespace."
          example: "operatorEnvelope"
        schemaType:
          type: "string"
          description: "Type of data the topic carries:\n- `JSD7`: JSON, for `pub` and `sub` channels. Payloads are checked against the schema.\n- `XML`: XML, for `pub` and `sub` channels.\n- `XSD6`: XML files, for `upload` and `download` channels.\n- `CSV`, `TSV`: comma or tab separated files, for `upload` and `download` channels."
          enum:
            - "JSD7"
            - "XML"
            - "XSD6"
            - "CSV"
            - "TSV"
          example: "JSD7"
        schema:
          type: "string"
          description: "Schema definition of this version as a string (for `JSD7`: the JSON Schema document encoded as JSON text)."
          example: "{\"type\":\"object\",\"properties\":{\"data\":{\"type\":\"number\"}}}"
        version:
          type: "string"
          description: "Version of the topic (`MAJOR.MINOR.PATCH`)."
          example: "1.0.9"
        owner:
          type: "string"
          description: "Owner of the topic: the namespace of the application (in the Energy Web SSI-Hub) the topic belongs to."
          example: "ddhub.apps.energyweb.iam.ewc"
        tags:
          description: "Labels to group and filter topics. Shared by all versions."
          example:
            - "aggregator"
          type: "array"
          items:
            type: "string"
      required:
        - "id"
        - "name"
        - "schemaType"
        - "schema"
        - "version"
        - "owner"
        - "tags"
    TopicCountDto:
      type: "object"
      properties:
        count:
          type: "number"
          description: "Number of topics this owner has on the message broker."
          example: 2
        owner:
          type: "string"
          description: "Application namespace the count belongs to."
          example: "ddhub.apps.energyweb.iam.ewc"
      required:
        - "count"
        - "owner"
    PostTopicBodyDto:
      type: "object"
      properties:
        name:
          type: "string"
          description: "Topic name, unique within `owner`.\n- 1 to 255 characters: letters, digits, dots and underscores.\n- No spaces or dashes."
          example: "operatorEnvelope"
          pattern: "^[a-zA-z0-9.]{1,255}$"
          minLength: 1
          maxLength: 255
        schemaType:
          type: "string"
          description: "Type of data the topic carries. Cannot be changed later.\n- `JSD7`: JSON, for `pub` and `sub` channels. Payloads are checked against the schema.\n- `XML`: XML, for `pub` and `sub` channels.\n- `XSD6`: XML files, for `upload` and `download` channels.\n- `CSV`, `TSV`: comma or tab separated files, for `upload` and `download` channels."
          enum:
            - "JSD7"
            - "XML"
            - "XSD6"
            - "CSV"
            - "TSV"
          example: "JSD7"
        schema:
          type: "string"
          description: "Schema of the first version, as a string. For `JSD7`, a JSON Schema as JSON text. An invalid schema returns `MB::ERROR`."
          example: "{\"type\":\"object\",\"properties\":{\"data\":{\"type\":\"number\"}}}"
        version:
          type: "string"
          description: "First version (`MAJOR.MINOR.PATCH`)."
          example: "1.0.0"
          pattern: "^(\\d+\\.)(\\d+\\.)(\\d+)$"
        owner:
          type: "string"
          description: "Application namespace that owns the topic. An invalid owner returns `MB::ERROR`."
          example: "ddhub.apps.energyweb.iam.ewc"
        tags:
          description: "Labels to group and filter topics, unique. Send `[]` for none."
          example:
            - "aggregator"
          type: "array"
          items:
            type: "string"
      required:
        - "name"
        - "schemaType"
        - "schema"
        - "version"
        - "owner"
        - "tags"
    UpdateTopicHistoryBodyDto:
      type: "object"
      properties:
        schema:
          type: "string"
          description: "Schema of the version, as a string. For `JSD7`, a JSON Schema as JSON text."
          example: "{\"type\":\"object\",\"properties\":{\"data\":{\"type\":\"number\"}}}"
      required:
        - "schema"
    UpdateTopicBodyDto:
      type: "object"
      properties:
        tags:
          description: "The full new list of tags; replaces the current tags. Send `[]` to remove all."
          example:
            - "aggregator"
          type: "array"
          items:
            type: "string"
      required:
        - "tags"
    PutTopicDto:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Topic id assigned by the message broker when the topic was created. All versions of a topic share the same id."
          example: "62545547fe37f174d7715ff3"
        name:
          type: "string"
          description: "Topic name, unique within its owner namespace."
          example: "operatorEnvelope"
        schemaType:
          type: "string"
          description: "Type of data the topic carries:\n- `JSD7`: JSON, for `pub` and `sub` channels. Payloads are checked against the schema.\n- `XML`: XML, for `pub` and `sub` channels.\n- `XSD6`: XML files, for `upload` and `download` channels.\n- `CSV`, `TSV`: comma or tab separated files, for `upload` and `download` channels."
          enum:
            - "JSD7"
            - "XML"
            - "XSD6"
            - "CSV"
            - "TSV"
          example: "JSD7"
        owner:
          type: "string"
          description: "Owner of the topic: the namespace of the application (in the Energy Web SSI-Hub) the topic belongs to."
          example: "ddhub.apps.energyweb.iam.ewc"
        tags:
          description: "The tags of the topic now."
          example:
            - "aggregator"
          type: "array"
          items:
            type: "string"
      required:
        - "id"
        - "name"
        - "schemaType"
        - "owner"
        - "tags"
    DeleteTopic:
      type: "object"
      properties:
        timestamp:
          type: "string"
          description: "Time of the deletion as reported by the message broker."
          example: "2026-04-12T10:15:30.000Z"
        returnCode:
          type: "string"
          description: "Return code reported by the message broker."
          example: "200"
        returnMessage:
          type: "string"
          description: "Human-readable result reported by the message broker."
          example: "Success"
      required:
        - "timestamp"
        - "returnCode"
        - "returnMessage"
    CronResponseDto:
      type: "object"
      properties:
        createdDate:
          type: "string"
          description: "When the entry for this job was first created, i.e. the end of its first recorded run (since the last reset of the job history)."
          format: "date-time"
          example: "2024-05-15T11:50:02.000Z"
        executedAt:
          type: "string"
          description: "When the latest run finished and recorded `latestStatus`."
          format: "date-time"
          example: "2024-05-15T12:03:09.236Z"
        jobName:
          type: "string"
          description: "Job identifier. Jobs that report a status here (the settings that control each job in brackets):\n- `APPLICATIONS_REFRESH`: refreshes the applications the gateway DID is related to from SSI Hub (`APPLICATION_CRON_*`).\n- `TOPIC_REFRESH`: refreshes topics of those applications from the Message Broker (`TOPICS_CRON_*`).\n- `CHANNEL_ROLES`: resolves the roles configured on channels into the DIDs that hold them (`CHANNEL_DID_CRON_*`).\n- `DID_LISTENER`: picks up key changes of other parties (runs when their DID document changes).\n- `SYMMETRIC_KEYS`: fetches the keys needed to decrypt received messages (`SYMMETRIC_KEYS_CRON_*`).\n- `ASSOCIATION_KEYS`: generates the current and next association keys and removes old ones (`ASSOCIATION_KEYS_CRON_*`).\n- `ROLES_REFRESH`: refreshes the enrolment of the gateway DID and publishes approved claims to the DID document (`ROLES_REFRESH_CRON_*`).\n- `PRIVATE_KEY`: detects a change of the stored private key (`PRIVATE_KEY_CRON_*`).\n- `CLIENTS`: finds outdated message broker clients and deletes them (`CLIENTS_CRON_*`).\n- `FILE_CLEANER`: deletes expired downloaded files (`FILE_CLEANER_CRON_*`).\n- `INTERNAL_MESSAGE_CLEANER`: cleans stored messages data (`MESSAGE_CLEANER_CRON_*`).\n- `MESSAGES_FETCH`: fetches messages from the Message Broker in the background (`FETCH_MESSAGES_CRON_*`).\n- `OFFLINE_MESSAGES_CLEANER`: cleans up stored messages (`CLEANUP_MESSAGES_CRON_*`)."
          example: "ROLES_REFRESH"
          enum:
            - "DID_LISTENER"
            - "CHANNEL_ROLES"
            - "TOPIC_REFRESH"
            - "SYMMETRIC_KEYS"
            - "ASSOCIATION_KEYS"
            - "PRIVATE_KEY"
            - "APPLICATIONS_REFRESH"
            - "HEARTBEAT"
            - "FILE_CLEANER"
            - "EVENTS"
            - "ROLES_REFRESH"
            - "INTERNAL_MESSAGE_CLEANER"
            - "CLIENTS"
            - "ASSOCIATION_KEYS_SHARE"
            - "MESSAGES_FETCH"
            - "OFFLINE_MESSAGES_CLEANER"
        latestStatus:
          type: "string"
          description: "Result of the latest run:\n- `SUCCESS`: completed.\n- `FAILED`: failed; see the gateway logs."
          example: "SUCCESS"
          enum:
            - "SUCCESS"
            - "FAILED"
        updatedDate:
          type: "string"
          description: "When the entry was last written (same as `executedAt`)."
          example: "2024-05-15T12:03:09.000Z"
          format: "date-time"
      required:
        - "createdDate"
        - "executedAt"
        - "jobName"
        - "latestStatus"
        - "updatedDate"
    GatewayResponseDto:
      type: "object"
      properties:
        did:
          type: "string"
          nullable: true
          description: "DID of the gateway. Null when no identity is set up."
          example: "did:ethr:volta:0xfeFBb03EFc1054Cc4e3Fbf36362689cc1F5924a8"
        authEnabled:
          type: "boolean"
          description: "Whether user login is enabled (`USER_AUTH_ENABLED`, default `false`).\n- `true`: protected endpoints need a login token or an API key.\n- `false`: all endpoints are open."
          example: true
        messageBrokerStatus:
          type: "string"
          enum:
            - "OK"
            - "ERROR"
          description: "Whether the gateway can reach the EWDS Message Broker:\n- `OK`: yes.\n- `ERROR`: no, for example because the certificate is missing or wrong. Messaging does not work."
          example: "OK"
        mtlsIsValid:
          type: "boolean"
          description: "Whether the gateway certificate is loaded. Only present when `MTLS_ENABLED=true` (the default).\n- `true`: loaded.\n- `false`: not uploaded yet.\n- Does not show whether the broker accepts it (see `messageBrokerStatus`)."
          example: true
        isAssociationKeyEnabled:
          type: "boolean"
          description: "Whether association key sharing is set up:\n- `true`: `AK_FQCN`, `AK_TOPIC_NAME`, `AK_TOPIC_OWNER` and `AK_TOPIC_VERSION` are set.\n- `false`: at least one is missing."
          example: false
        namespace:
          type: "string"
          description: "Application namespace the gateway enrols under (`PARENT_NAMESPACE`). The required role is `user.roles.<namespace>`."
          example: "ddhub.apps.energyweb.iam.ewc"
        version:
          type: "string"
          description: "Version of the gateway. `NOT_DETECTED` when the version is unknown."
          example: "v15.15.0"
      required:
        - "did"
        - "authEnabled"
        - "messageBrokerStatus"
        - "isAssociationKeyEnabled"
        - "namespace"
        - "version"
    GetAllClientsResponseDto:
      type: "object"
      properties:
        clientId:
          type: "string"
          example: "consumer01:channel.name"
          description: "Client id, usually `<clientId>:<fqcn>`.\n- Added when messages are fetched, or a WebSocket connects, with a `clientId`.\n- Ids the Message Broker already knows are added automatically."
        createdDate:
          type: "string"
          format: "date-time"
          example: "2026-09-21T08:04:06.020Z"
          description: "When the client id was first registered in the gateway (ISO 8601)."
        updatedDate:
          type: "string"
          format: "date-time"
          example: "2026-10-02T14:31:55.112Z"
          description: "When the client id was last used (ISO 8601). Deleted automatically after `CLIENT_EXPIRATION_DAYS` days unused (default 30)."
      required:
        - "clientId"
        - "createdDate"
        - "updatedDate"
    DeleteManyClientsBodyDto:
      type: "object"
      properties:
        clientsIds:
          description: "Client ids to delete.\n- Unique; no spaces, line breaks or `&` `<` `>` `\"` `'` `/`.\n- Unknown ids are ignored."
          example:
            - "consumer01:channel.name"
            - "consumer02:channel.name"
          uniqueItems: true
          type: "array"
          items:
            type: "string"
      required:
        - "clientsIds"
    CreateContactDto:
      type: "object"
      properties:
        did:
          type: "string"
          description: "DID of the contact: `did:<method>:[<chain>:]0x<40 hex characters>`. Case sensitive."
          example: "did:ethr:volta:0xfeFBb03EFc1054Cc4e3Fbf36362689cc1F5924a8"
          pattern: "^did:[a-z0-9]+:([a-z0-9]+:)?0x[A-Fa-f0-9]{40}$"
        alias:
          type: "string"
          description: "Human readable name for the DID. 3 to 255 characters. Must be unique across all contacts."
          example: "Grid Operator North"
          minLength: 3
          maxLength: 255
      required:
        - "did"
        - "alias"
    UpdateContactRequestDto:
      type: "object"
      properties:
        alias:
          type: "string"
          description: "New display name for the contact. 3 to 255 characters. Must not be used by another contact."
          example: "Grid Operator North (backup)"
          minLength: 3
          maxLength: 255
      required:
        - "alias"
    GetAllContactsResponseDto:
      type: "object"
      properties:
        did:
          type: "string"
          description: "DID of the contact, exactly as it was stored."
          example: "did:ethr:volta:0x782aB0383Bfc807439d8EE29516937B47815d697"
        alias:
          type: "string"
          description: "Display name of the contact (unique across contacts)."
          example: "Grid Operator North"
      required:
        - "did"
        - "alias"
    ConfigResponseDto:
      type: "object"
      properties:
        authEnabled:
          type: "boolean"
          description: "Whether user login is enabled (`USER_AUTH_ENABLED`, default `false`).\n- `true`: protected endpoints need a login token or an API key.\n- `false`: no credentials needed; login is not available."
          example: true
      required:
        - "authEnabled"
    RefreshTokenRequestDto:
      type: "object"
      properties:
        refreshToken:
          type: "string"
          description: "Refresh token from an earlier login or refresh (valid 20 hours). An access token is rejected."
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6Im9wZXJhdG9yMDEiLCJhY2NvdW50VHlwZSI6ImFkbWluIiwidHlwZSI6InJlZnJlc2gifQ.signature"
      required:
        - "refreshToken"
    LoginResponseDto:
      type: "object"
      properties:
        accessToken:
          type: "string"
          description: "Access token, valid for 1 hour. Send it as `Authorization: Bearer <accessToken>` on protected endpoints."
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6Im9wZXJhdG9yMDEiLCJhY2NvdW50VHlwZSI6ImFkbWluIiwidHlwZSI6ImFjY2VzcyJ9.signature"
        refreshToken:
          type: "string"
          description: "Refresh token, valid for 20 hours. Use it to get new tokens before the access token expires."
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6Im9wZXJhdG9yMDEiLCJhY2NvdW50VHlwZSI6ImFkbWluIiwidHlwZSI6InJlZnJlc2gifQ.signature"
        role:
          type: "string"
          description: "Role of the user:\n- `admin`: all endpoints.\n- `superadmin`: same as `admin`.\n- `messaging`: messaging and read-only lookups only."
          enum:
            - "admin"
            - "superadmin"
            - "messaging"
          example: "admin"
        username:
          type: "string"
          description: "Username the tokens were issued for."
          example: "operator01"
      required:
        - "accessToken"
        - "refreshToken"
        - "role"
        - "username"
    LoginRequestDto:
      type: "object"
      properties:
        username:
          type: "string"
          description: "Username (exact, case sensitive)."
          example: "operator01"
          minLength: 4
          maxLength: 64
        password:
          type: "string"
          description: "Password of the user account. Compared as-is with the stored password."
          example: "change-me-please"
          minLength: 4
          maxLength: 128
          format: "password"
      required:
        - "username"
        - "password"
    UserDetailsDto:
      type: "object"
      properties:
        username:
          type: "string"
          example: "operator01"
          description: "Username of the account."
        password:
          type: "string"
          example: "change-me-please"
          description: "Password of the account. Treat this response as sensitive."
          format: "password"
        role:
          type: "string"
          example: "admin"
          description: "Role of the account:\n- `admin`: all endpoints.\n- `superadmin`: same as `admin`; cannot be created through the API.\n- `messaging`: messaging and read-only lookups only."
          enum:
            - "admin"
            - "superadmin"
            - "messaging"
      required:
        - "username"
        - "password"
        - "role"
    ApiKeyResponseDto:
      type: "object"
      properties:
        apiKey:
          type: "string"
          description: "The API key (48 lowercase letters and digits). Send it in the `x-api-key` header."
          example: "k3v9x0q2m7w1z8r4t6y5u0i9o8p7a6s5d4f3g2h1j0klzx9c"
        name:
          type: "string"
          description: "Human readable label of the key, chosen when the key is created or updated. The name is unique across API keys."
          example: "erp-integration"
        expiresAt:
          type: "string"
          description: "When the key stops working (ISO 8601). Expired keys stay listed until deleted."
          example: "2026-12-18T10:15:30.000Z"
          format: "date-time"
        role:
          type: "string"
          description: "Access of the key:\n- `admin`: all endpoints.\n- `superadmin`: same as `admin`.\n- `messaging`: messaging and read-only lookups only. Keys without a role get this access."
          enum:
            - "admin"
            - "superadmin"
            - "messaging"
          example: "messaging"
      required:
        - "apiKey"
        - "name"
        - "expiresAt"
        - "role"
    RequesterClaimDTO:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Id of the role request. Use it to withdraw a pending request."
          example: "7281a130-e2b1-430d-8c14-201010eae901"
        token:
          type: "string"
          description: "Token of the role request, as kept by SSI Hub. For information only; no gateway endpoint needs it."
          example: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJjbGFpbURhdGEiOnt9fQ.c2lnbmF0dXJl"
        role:
          type: "string"
          description: "Short role name: the first segment of the claim type (for `user.roles.ddhub.apps.energyweb.iam.ewc` it is `user`)."
          example: "user"
        requestDate:
          type: "string"
          description: "When the claim was requested, as reported by SSI Hub (ISO 8601)."
          format: "date-time"
          example: "2024-01-15T10:30:00.000Z"
        namespace:
          type: "string"
          description: "Namespace of the application or organisation that defines the role (the claim type without its `<role>.roles.` prefix)."
          example: "ddhub.apps.energyweb.iam.ewc"
        status:
          type: "string"
          enum:
            - "NOT_ENROLLED"
            - "AWAITING_APPROVAL"
            - "APPROVED"
            - "REJECTED"
            - "SYNCED"
          description: "Status of the request:\n- `AWAITING_APPROVAL`: waiting for an issuer; can be withdrawn.\n- `APPROVED`: approved; the gateway publishes it within about a minute.\n- `REJECTED`: rejected; request it again if needed."
          example: "APPROVED"
        expirationDate:
          type: "string"
          description: "When the issued credential expires (ISO 8601). Null when the claim has no expiration."
          format: "date-time"
          example: "2025-12-31T23:59:59.000Z"
          nullable: true
        expirationStatus:
          type: "string"
          description: "Expiration state of the claim:\n- `EXPIRED`: `expirationDate` is in the past; the role is no longer valid and must be requested again.\n- `null`: not expired, or no expiration set."
          example: "EXPIRED"
          nullable: true
      required:
        - "id"
        - "token"
        - "role"
        - "requestDate"
        - "namespace"
        - "status"
    SearchAppDTO:
      type: "object"
      properties:
        name:
          type: "string"
          description: "Name of the application or organisation node in SSI Hub (usually the first label of its namespace)."
          example: "ddhub"
        namespace:
          type: "string"
          description: "Full namespace of the application or organisation."
          example: "ddhub.apps.energyweb.iam.ewc"
        appName:
          type: "string"
          description: "Display name from the application definition. Empty string for organisations, which have no application definition."
          example: "EWDS"
        logoUrl:
          type: "string"
          description: "Logo URL from the application definition. Empty string for organisations; omitted when an application defines no logo."
          example: "https://example.com/logo.png"
      required:
        - "name"
        - "namespace"
        - "appName"
    FieldDefinitionDTO:
      type: "object"
      properties:
        fieldType:
          oneOf:
            - type: "string"
              enum:
                - "text"
                - "number"
                - "date"
                - "boolean"
                - "json"
          description: "Type of the field:\n- `text`: `minLength`, `maxLength` and `pattern` may apply.\n- `number`: `minValue` and `maxValue` may apply.\n- `date`: `minDate` and `maxDate` may apply.\n- `boolean`: true or false.\n- `json`: a JSON document sent as a string; `schema` may describe it."
          example: "text"
        label:
          type: "string"
          description: "Label of the field. Send it as `key` when requesting the role."
          example: "Company Name"
        required:
          type: "boolean"
          description: "Whether a value must be provided. Treated as false when omitted."
          example: true
        minLength:
          type: "number"
          description: "Minimum number of characters (`text` fields)."
          example: 3
        maxLength:
          type: "number"
          description: "Maximum number of characters (`text` fields)."
          example: 100
        pattern:
          type: "string"
          description: "Regular expression the value must match (`text` fields)."
          example: "^[A-Za-z0-9 ]+$"
        minValue:
          type: "number"
          description: "Smallest allowed value (`number` fields)."
          example: 0
        maxValue:
          type: "number"
          description: "Largest allowed value (`number` fields)."
          example: 1000
        minDate:
          format: "date-time"
          type: "string"
          description: "Earliest allowed date (`date` fields)."
          example: "2020-01-01"
        maxDate:
          format: "date-time"
          type: "string"
          description: "Latest allowed date (`date` fields)."
          example: "2030-12-31"
        schema:
          type: "object"
          description: "JSON Schema the value should conform to (`json` fields), as defined by the role owner."
          additionalProperties: true
          example:
            type: "object"
            properties:
              id:
                type: "string"
      required:
        - "fieldType"
        - "label"
    ApplicationRoleDTO:
      type: "object"
      properties:
        role:
          type: "string"
          description: "Short role name (first label of the role namespace), e.g. `user` for `user.roles.ddhub.apps.energyweb.iam.ewc`."
          example: "user"
        namespace:
          type: "string"
          description: "Full role namespace (`<role>.roles.<application namespace>`). Send it as `role` when requesting the role."
          example: "user.roles.ddhub.apps.energyweb.iam.ewc"
        requestorFields:
          description: "Fields to fill in when requesting this role. Empty when there are none."
          type: "array"
          items:
            $ref: "#/components/schemas/FieldDefinitionDTO"
      required:
        - "role"
        - "namespace"
    RequestorFieldDto:
      type: "object"
      properties:
        key:
          type: "string"
          description: "The `label` of the role field."
          example: "Company Name"
        value:
          description: "Field value: a string or a number, according to the `fieldType` of the matching role field (for `json` fields send the JSON as a string)."
          oneOf:
            - type: "string"
            - type: "number"
          example: "Acme Energy Ltd"
      required:
        - "key"
        - "value"
    RequestRoleDto:
      type: "object"
      properties:
        role:
          type: "string"
          description: "Full role namespace to request: `<role>.roles.<application namespace>`."
          example: "user.roles.ddhub.apps.energyweb.iam.ewc"
        requestorFields:
          description: "Values for the fields the role definition asks requestors to fill in (`requestorFields`). Omit or send an empty array when the role has none."
          type: "array"
          items:
            $ref: "#/components/schemas/RequestorFieldDto"
      required:
        - "role"
