  /api/v2/topics:
    get:
      description: "Lists the topics of one application, each at its highest version.\n\n**Send**\n- `owner`: application namespace. Required.\n- `name`: optional, exact topic name.\n- `tags`: optional; a topic matches when one of its tags contains the given text.\n- `page`, `limit`: paging (default 5 per page).\n\n**Returns**\n- `records`: a list of topics, each with its schema.\n- `count`: number of matching topics across all pages.\n\n**Notes**\n- Covers the applications in which the gateway holds a role.\n- Changes made outside this gateway appear within about a minute.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "TopicsController_getTopics"
      parameters:
        - name: "limit"
          required: false
          in: "query"
          description: "Page size: maximum number of records to return. Defaults to 5 when omitted. Must be a number; send a positive integer."
          schema:
            default: 5
            example: 10
            type: "number"
        - name: "page"
          required: false
          in: "query"
          description: "Page number, starting at 1. Defaults to 1 when omitted. Must be a positive number (send an integer >= 1)."
          schema:
            default: 1
            example: 1
            type: "number"
        - name: "name"
          required: false
          in: "query"
          description: "Only return the topic with exactly this name (exact, case-sensitive match). Omit to return all topics of the owner."
          schema:
            example: "operatorEnvelope"
            type: "string"
        - name: "owner"
          required: true
          in: "query"
          description: "Application namespace whose topics to list (required). Must be an application namespace, for example `<app>.apps.<org>.iam.ewc`."
          schema:
            example: "ddhub.apps.energyweb.iam.ewc"
            type: "string"
        - name: "tags"
          required: false
          in: "query"
          description: "Topics with at least one of these tags; a tag matches when it contains the text. Repeat it for several tags."
          schema:
            example:
              - "aggregator"
            type: "array"
            items:
              type: "string"
      responses:
        200:
          description: "One page of topics (empty `records` when nothing matches or the gateway does not know the owner)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"
        400:
          description: "Request validation failed (`VALIDATION::FAILED`). `err.additionalDetails.errors` lists every failed constraint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "List the topics of an application"
      tags:
        - "Topics"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: true
    post:
      description: "Creates a topic with its first version.\n\n**Send**\n- `name`: unique within `owner`.\n- `owner`: application namespace.\n- `schemaType`: `JSD7` or `XML` for `pub` and `sub` channels; `XSD6`, `CSV` or `TSV` for `upload` and `download`. Cannot be changed later.\n- `version`: first version (`MAJOR.MINOR.PATCH`).\n- `schema` and `tags`.\n\n**Returns**\n- The new topic, including its `id`.\n\n**Notes**\n- On an error, check whether the topic was created before retrying; it can take up to a minute to appear.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
