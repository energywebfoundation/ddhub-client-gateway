openapi: "3.0.0"
paths:
  /api/v2/identity:
    get:
      description: "Shows the gateway identity and whether it is ready.\n\n**Returns**\n- `address` and `publicKey` of the identity.\n- `balance`: funds on the address (`NONE`, `LOW` or `OK`).\n- `enrolment`: the roles of the gateway and their status.\n\n**Notes**\n- Ready when `balance` is not `NONE` and every required role is `SYNCED`.\n- `ID::NO_PRIVATE_KEY` when no identity is set up yet.\n- Needs the blockchain to be reachable.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`."
      operationId: "IdentityController_get"
      parameters: []
      responses:
        200:
          description: "Gateway identity with its current enrolment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponseDto"
        400:
          description: "No identity configured (`ID::NO_PRIVATE_KEY`): no identity has been set up yet, or it is not loaded yet. Set one with `POST /api/v2/identity`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Get the gateway identity, balance and enrolment"
      tags:
        - "Identity"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: false
    post:
      description: "Sets or replaces the private key that defines the gateway identity (DID).\n\n**Send**\n- `privateKey`: 64 hex characters, with or without `0x`.\n\n**Returns**\n- The new identity, with its balance and enrolment.\n\n**Notes**\n- The address of the key must hold funds: setting up the identity costs a small transaction fee.\n- A different key deletes all data of the previous identity (channels, topics, applications, contacts, clients, messages).\n- Sending the current key again keeps everything.\n- Without `privateKey` a new, unfunded key is generated, so the request fails.\n- Can take a while: it waits for the blockchain and SSI Hub.\n- The gateway then requests its role automatically.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "IdentityController_post"
      parameters: []
      requestBody:
        required: true
        description: "Private key to use. Its address must hold funds on the configured chain."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIdentityDto"
      responses:
        200:
          description: "Identity configured. Returns the new identity with its freshly computed enrolment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponseDto"
        400:
          description: "- Request validation failed (`VALIDATION::FAILED`), e.g. `privateKey` is not a string.\n- `ID::INVALID_PRIVATE_KEY`: `privateKey` does not have a valid length (66 characters with `0x`, or 64 without)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Returned as `DHCG::UNKNOWN` (see `err.reason`) for:\n- Zero balance: `Not enough balance. Address: 0x...`. Fund that address and retry with the same key.\n- A private key of the right length that is not valid hex.\n- The blockchain or the SSI Hub could not be reached, or the keys could not be published or saved. Retry later with the same key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Set the gateway private key (create or replace the identity)"
      tags:
        - "Identity"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
  /api/v2/identity/claims:
    get:
      description: "Lists the role claims SSI Hub holds for the gateway DID.\n\n**Returns**\n- The gateway DID and a list of its claims. Each claim has its role, approval status and `syncedToDidDoc` (published in the DID document).\n\n**Notes**\n- Only roles that were requested are listed.\n- Needs a configured identity, otherwise `500 DHCG::UNKNOWN`.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`."
      operationId: "IdentityController_getClaims"
      parameters: []
      responses:
        200:
          description: "Gateway DID and its claims."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimsResponseDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "List the claims held by the gateway DID"
      tags:
        - "Identity"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: false
  /api/v2/enrol:
    get:
      description: "Shows the roles of the gateway and their status.\n\n**Returns**\n- `roles`: a list of the gateway roles, each with its `status`: `NOT_ENROLLED`, `AWAITING_APPROVAL`, `APPROVED`, `REJECTED` or `SYNCED`.\n\n**Notes**\n- The gateway is ready when every required role is `SYNCED`.\n- Updated about once a minute.\n- Needs a configured identity, otherwise `500 DHCG::UNKNOWN`.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`."
      operationId: "EnrolmentController_get"
      parameters: []
      responses:
        200:
          description: "Enrolment of the gateway DID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolmentDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Get the enrolment status of the gateway DID"
      tags:
        - "Enrolment"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: false
    post:
      description: "Requests the role the gateway needs.\n\n**Notes**\n- The gateway does this by itself; call it only to retry.\n- Needs a configured identity with funds.\n- Roles already requested, approved, rejected or synced are not requested again.\n- An issuer approves the request outside the gateway.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "EnrolmentController_init"
      parameters: []
      responses:
        201:
          description: "Enrolment started, or nothing to do because every required role is already `SYNCED`. Empty body."
        400:
          description: "No identity configured (`ID::NO_PRIVATE_KEY`). Set one with `POST /api/v2/identity` first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Returned as `DHCG::UNKNOWN` (see `err.reason`) for:\n- Zero balance: `Not enough balance. Address: 0x...`. Fund the address and retry.\n- SSI Hub or the blockchain could not be reached, or the role request was refused. Retry later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Start enrolment of the gateway DID"
      tags:
        - "Enrolment"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
  /api/v2/certificate:
    post:
      description: "Uploads the certificate the gateway uses to connect securely to the EWDS Message Broker.\n\n**Send** (form upload)\n- `certificate`: PEM file. Required.\n- `privateKey`: PEM file without a password. Required.\n- `caCertificate`: PEM file. Only for a Message Broker with a private certificate authority.\n\n**Returns**\n- `201` with an empty body.\n\n**Notes**\n- Each upload replaces the previous files; leaving out `caCertificate` removes an earlier one.\n- With the default settings, channels, topics and messaging work only once a certificate is in place.\n- Files are not checked on upload: a wrong file shows up later as `mtlsIsValid: false` in the gateway status.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`."
      operationId: "CertificateController_save"
      parameters: []
      requestBody:
        required: true
        description: "Certificate files as multipart form fields."
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadCertificateBodyDto"
      responses:
        201:
          description: "Certificate files stored and loaded. Empty body."
        400:
          description: "Request validation failed (`VALIDATION::FAILED`). `err.additionalDetails.errors` lists every failed constraint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Returned as `DHCG::UNKNOWN` (see `err.reason`) for:\n- `certificate` or `privateKey` missing or empty: `Both certificate and privateKey files are required`.\n- A form field with another name, or more than one file in a field (`Unexpected field`).\n- The files could not be saved."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Upload the mTLS client certificate for the Message Broker"
      tags:
        - "Gateway Configuration"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: false
  /api/v2/channels/messages/count:
    get:
      description: "Counts the stored messages of each channel with message forms enabled.\n\n**Send** (optional filters)\n- `type`, `useAnonymousExtChannel`, `payloadEncryption`.\n\n**Returns**\n- A list of channels, each with its message count: sent messages for `pub`; received messages for `sub`, `upload` and `download`.\n- An empty list when no channel matches.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "ChannelController_getCountOfChannels"
      parameters:
        - name: "type"
          required: false
          in: "query"
          description: "Only channels of this type. Omit for all."
          schema:
            example: "sub"
            type: "string"
            enum:
              - "sub"
              - "pub"
              - "download"
              - "upload"
        - name: "useAnonymousExtChannel"
          required: false
          in: "query"
          description: "Only channels with this value.\n- Any non-empty value, including `false`, is read as `true`. Send an empty value (`?flag=`) for `false`."
          schema:
            example: false
            type: "boolean"
        - name: "payloadEncryption"
          required: false
          in: "query"
          description: "Only channels with this value.\n- Any non-empty value, including `false`, is read as `true`. Send an empty value (`?flag=`) for `false`."
          schema:
            example: true
            type: "boolean"
      responses:
        200:
          description: "A list of matching channels with message forms enabled, each with its count. Empty if none match."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/GetChannelMessagesCountDto"
        400:
          description: "Request validation failed (`VALIDATION::FAILED`). `err.additionalDetails.errors` lists every failed constraint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Count locally stored messages of all message-forms channels"
      tags:
        - "Channels"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: true
  /api/v2/channels/messages/count/{fqcn}:
    get:
      description: "Counts the stored messages of one channel.\n\n**Send**\n- `fqcn` of a channel with message forms enabled.\n\n**Returns**\n- Sent messages for a `pub` channel; received messages for other types.\n\n**Notes**\n- `CHANNEL::MESSAGE_FORMS_ONLY` when message forms are off for the channel.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "ChannelController_getCount"
      parameters:
        - name: "fqcn"
          required: true
          in: "path"
          description: "FQCN (fully qualified channel name) of an existing channel. Only lowercase letters, digits and dots, 1 to 255 characters."
          schema:
            example: "ewds.market.operator.pub"
            type: "string"
      responses:
        200:
          description: "Number of stored messages of the channel."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetChannelMessagesCountDto"
        400:
          description: "The count cannot be returned. `err.code`:\n- `CHANNEL::NOT_FOUND`: no channel with this FQCN exists in this gateway (note: returned as 400, not 404).\n- `CHANNEL::MESSAGE_FORMS_ONLY`: the channel has `messageForms = false`, so no messages are stored for it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Count locally stored messages of one channel"
      tags:
        - "Channels"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: true
  /api/v2/channels:
    post:
      description: "Creates a channel: which topics, in which direction, and with which DIDs or roles.\n\n**Send**\n- `fqcn`: unique name (lowercase letters, digits and dots).\n- `type`: `pub`, `sub`, `upload` or `download`.\n- `conditions.topics`: topics that exist on the Message Broker; their schema type must fit the channel type.\n- `conditions.dids`, `conditions.roles`: who can exchange data on the channel.\n- `payloadEncryption`, `messageForms`, `useAnonymousExtChannel`.\n\n**Returns**\n- The created channel.\n\n**Notes**\n- Send `conditions` and `conditions.topics` even when empty (`[]`).\n- `type`, `useAnonymousExtChannel` and `messageForms` cannot be changed later.\n- Recipients (`qualifiedDids`) are updated about once a minute.\n- On an error, check whether the channel was created before retrying.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "ChannelController_create"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelDto"
      responses:
        201:
          description: "The created channel."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetChannelResponseDto"
        400:
          description: "The channel could not be created. `err.code`:\n- `VALIDATION::FAILED`: request validation failed, details in `err.additionalDetails.errors`.\n- `CHANNEL::ALREADY_EXISTS`: a channel with this FQCN already exists.\n- `TOPIC::NOT_FOUND`: a topic name/owner pair was not found (or not uniquely) on the message broker, or this gateway does not know a `responseTopicId`. `err.reason` lists the missing topics.\n- `CHANNEL::CHANNEL_TOPIC_SCHEMA_TYPE_INVALID`: a topic schema type does not fit the channel type; `err.additionalDetails.topicId` names it.\n- `MB::ERROR` / `MB::UNKNOWN`: the message broker rejected or could not answer a topic or role lookup; the upstream reason is in `err.additionalDetails`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Create a channel"
      tags:
        - "Channels"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
        mtls: true
    get:
      description: "Lists the channels of this gateway.\n\n**Send** (optional filters)\n- `type`, `payloadEncryption`, `messageForms`, `useAnonymousExtChannel`.\n\n**Returns**\n- A list of all matching channels, not paged.\n\n**Notes**\n- `?messageForms=false` is read as `true`; send an empty value (`?messageForms=`) to filter on `false`. The same applies to the other true/false filters.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "ChannelController_getByType"
      parameters:
        - name: "type"
          required: false
          in: "query"
          description: "Only channels of this type (`pub`, `sub`, `upload`, `download`). Omit for all."
          schema:
            example: "sub"
            type: "string"
            enum:
              - "sub"
              - "pub"
              - "download"
              - "upload"
        - name: "useAnonymousExtChannel"
          required: false
          in: "query"
          description: "Only channels with this value.\n- Any non-empty value, including `false`, is read as `true`. Send an empty value (`?flag=`) for `false`."
          schema:
            example: true
            type: "boolean"
        - name: "payloadEncryption"
          required: false
          in: "query"
          description: "Only channels with this value.\n- Any non-empty value, including `false`, is read as `true`. Send an empty value (`?flag=`) for `false`."
          schema:
            example: true
            type: "boolean"
        - name: "messageForms"
          required: false
          in: "query"
          description: "Only channels with this value.\n- Any non-empty value, including `false`, is read as `true`. Send an empty value (`?flag=`) for `false`."
          schema:
            example: true
            type: "boolean"
      responses:
        200:
          description: "Matching channels (empty array when none match)."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/GetChannelResponseDto"
        400:
          description: "Request validation failed (`VALIDATION::FAILED`). `err.additionalDetails.errors` lists every failed constraint."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "List channels"
      tags:
        - "Channels"
      security:
        - bearer: []
        - api-key: []
      x-access:
        public: false
        roles:
          - "admin"
          - "superadmin"
          - "messaging"
        mtls: true
  /api/v2/channels/{fqcn}:
    get:
      description: "Gets the configuration of one channel.\n\n**Returns**\n- Type, settings, conditions, topics, `qualifiedDids` and timestamps.\n\n**Notes**\n- `qualifiedDids` is updated about once a minute.\n\n**Access**\n\n- Login token (`Authorization: Bearer`) or API key (`x-api-key`), when `USER_AUTH_ENABLED=true`.\n- Roles: `admin`, `superadmin`, `messaging`.\n- Needs the gateway certificate to be uploaded, otherwise `403 DHCG::UNAUTHORIZED`."
      operationId: "ChannelController_get"
      parameters:
        - name: "fqcn"
          required: true
          in: "path"
          description: "FQCN (fully qualified channel name) of an existing channel. Only lowercase letters, digits and dots, 1 to 255 characters."
          schema:
            pattern: "^[a-z0-9.]{1,255}$"
            example: "ewds.market.operator.pub"
            type: "string"
      responses:
        200:
          description: "The channel."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetChannelResponseDto"
        400:
          description: "`err.code`:\n- `VALIDATION::FAILED`: request validation failed, details in `err.additionalDetails.errors`. (FQCN format)\n- `CHANNEL::NOT_FOUND`: no channel with this FQCN exists in this gateway (note: returned as 400, not 404)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        403:
          description: "Access denied (`DHCG::UNAUTHORIZED`): missing, expired or invalid credentials, a role that is not allowed on this endpoint, or mTLS could not be configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
        500:
          description: "Unexpected error (`DHCG::UNKNOWN`) or an upstream failure reported by the message broker / SSI Hub (`DDHUB::*`, `MB::*`, `IAM::*`, ...). See `err.code` and `err.reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseErrorDto"
      summary: "Get a channel"
      tags:
        - "Channels"
      security:
        - bearer: []
