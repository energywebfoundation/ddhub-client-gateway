x-gateway-env: &gateway-env
  SECRETS_ENGINE: $SECRETS_ENGINE
  AWS_REGION: $AWS_REGION
  AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
  AZURE_VAULT_URL: $AZURE_VAULT_URL
  AZURE_CLIENT_SECRET: $AZURE_CLIENT_SECRET
  AZURE_CLIENT_ID: $AZURE_CLIENT_ID
  AZURE_TENANT_ID: $AZURE_TENANT_ID

version: '3'
services:
  postgres:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=ddhub
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=ddhub
    ports:
      - '5432:5432'
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddhub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ddhub-gateway-migrationer:
    image: ewfcontainerregistry.azurecr.io/ddhub-client-gateway-backend:intelligent-canary
    container_name: ddhub-gateway-migrationer
    depends_on:
      postgres:
        condition: service_healthy
    command: "./node_modules/.bin/typeorm migrations:run"
    environment:
      <<: *gateway-env
    env_file:
      - .ewc-env

  ddhub-gateway-UI:
    image: ewfcontainerregistry.azurecr.io/ddhub-client-gateway-frontend:intelligent-canary
    ports:
      - "3000:80"

  ddhub-gateway-api:
    image: ewfcontainerregistry.azurecr.io/ddhub-client-gateway-backend:intelligent-canary
    container_name: ddhub-gateway-api
    depends_on:
      - 'postgres'
      - 'ddhub-gateway-migrationer'
    ports:
      - 3333:3333
    environment:
      <<: *gateway-env
    env_file:
      - .ewc-env

  ddhub-gateway-scheduler:
    image: ewfcontainerregistry.azurecr.io/ddhub-client-gateway-scheduler:intelligent-canary
    container_name: ddhub-gateway-scheduler
    depends_on:
      - 'postgres'
      - 'ddhub-gateway-migrationer'
    environment:
      <<: *gateway-env
    env_file:
      - .ewc-env

  proxy-server:
    image: nginx:alpine
    volumes:
      - ./proxy-config:/etc/nginx/conf.d
    ports:
      - "3009:80"
    depends_on:
      - ddhub-gateway-UI
      - ddhub-gateway-api
